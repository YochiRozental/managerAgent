<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העוזר התפעולי — גוטליב אדריכלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#F5F7F9; --surface:#FFFFFF; --surface-alt:#EEF2F5;
    --ink:#18242F; --ink-soft:#566673; --ink-faint:#8A98A3;
    --line:#D5DCE3; --line-strong:#A9B4BF;
    --accent:#2E6AAF; --accent-ink:#fff;
    --bubble-me:#2E6AAF; --bubble-bot:#FFFFFF;
    --overdue:#B23A3A; --overdue-soft:#f6e5e5;
    --warn:#A96A11; --ok:#2C7A68;
    --shadow:0 1px 2px rgba(24,36,47,.05),0 8px 24px rgba(24,36,47,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0D141C; --surface:#151F29; --surface-alt:#1B2833;
      --ink:#E3E9EE; --ink-soft:#94A3AF; --ink-faint:#6C7B87;
      --line:#29373F; --line-strong:#3C4C55;
      --accent:#6FA8DD; --accent-ink:#0D141C;
      --bubble-me:#2E6AAF; --bubble-bot:#1B2833;
      --overdue:#E4736B; --overdue-soft:#3a2422;
      --warn:#DBA654; --ok:#5DB6A0;
      --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Heebo","Assistant",system-ui,sans-serif;line-height:1.6;display:flex;flex-direction:column}
  a{color:var(--accent)}
  [hidden]{display:none!important}
  button.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:.82rem;padding:0}

  /* ---------- login ---------- */
  .login{max-width:420px;margin:12vh auto 0;padding:0 1.2rem;text-align:center}
  .brand{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
  .login h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:2rem;margin:.2rem 0 .1rem}
  .login p{color:var(--ink-soft);margin-top:0}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.6rem 0}
  .name-btn{padding:.8rem;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;font:inherit;font-size:1rem;box-shadow:var(--shadow)}
  .name-btn:hover{border-color:var(--accent);color:var(--accent)}
  .name-btn small{display:block;color:var(--ink-faint);font-size:.72rem;margin-top:.15rem}
  .err{color:var(--overdue);font-size:.85rem;min-height:1.2em}

  /* ---------- app shell ---------- */
  #app{flex:1;display:flex;flex-direction:column;min-height:0;max-width:780px;width:100%;margin:0 auto}
  header{border-bottom:1.5px solid var(--line-strong);padding:.7rem clamp(.8rem,3vw,1.4rem) .6rem;background:var(--paper)}
  .h-row{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:1.25rem;margin:0}
  .role{color:var(--ink-soft);font-size:.82rem;flex:1 1 100%}
  .h-actions{display:flex;gap:.9rem;margin-inline-start:auto}

  /* ---------- chat ---------- */
  #chat{flex:1;overflow-y:auto;padding:1rem clamp(.8rem,3vw,1.4rem);display:flex;flex-direction:column;gap:.7rem}
  .msg{max-width:80%;padding:.55rem .85rem;border-radius:14px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);font-size:.95rem}
  .msg.me{align-self:flex-start;background:var(--bubble-me);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-end;background:var(--bubble-bot);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.bot.intro{border-style:dashed}
  .acts{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;gap:.25rem}
  .act-note{font-size:.78rem;color:var(--ok);background:var(--surface-alt);border-radius:8px;padding:.2rem .6rem}
  .typing{align-self:flex-end;color:var(--ink-faint);font-size:.85rem;padding:.3rem .5rem}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;align-self:flex-end;margin-top:.2rem}
  .chip{font:inherit;font-size:.82rem;padding:.25rem .7rem;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- composer ---------- */
  form{display:flex;gap:.5rem;padding:.7rem clamp(.8rem,3vw,1.4rem);border-top:1.5px solid var(--line-strong);background:var(--paper)}
  #input{flex:1;font:inherit;font-size:.95rem;padding:.55rem .8rem;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);resize:none;max-height:6rem}
  #send{flex:0 0 auto;font:inherit;padding:0 1.1rem;border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
  #send:disabled{opacity:.5;cursor:default}

  /* ---------- oversight overlay ---------- */
  #oversight{position:fixed;inset:0;background:var(--paper);overflow-y:auto;padding:1.2rem clamp(.8rem,4vw,2rem) 3rem;z-index:10}
  #oversight .close{position:sticky;top:0;margin-inline-start:auto;display:block}
  .ov-wrap{max-width:860px;margin:0 auto}
  .sec-title{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:1.15rem;margin:1.6rem 0 .4rem}
  .scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{text-align:right;padding:.5rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{background:var(--surface-alt);font-size:.78rem;color:var(--ink-soft);border-bottom:1.5px solid var(--line-strong)}
  td.num{font-variant-numeric:tabular-nums;text-align:center}
  td.num.hot{color:var(--overdue);font-weight:700}
  .proj{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--warn);border-radius:3px;padding:.6rem .9rem;margin-bottom:.5rem;box-shadow:var(--shadow)}
  .proj-top{display:flex;justify-content:space-between;gap:1rem;font-weight:600}
  .proj-sub{font-size:.82rem;color:var(--ink-soft);margin-top:.15rem}
  .pchips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
  .pchip{font-size:.75rem;padding:.1rem .5rem;border-radius:999px;background:var(--surface-alt);color:var(--ink-soft)}
  .pchip.hot{background:var(--overdue-soft);color:var(--overdue);font-weight:600}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <p class="brand">גוטליב אדריכלים · סוכן תפעול</p>
  <h1>העוזר התפעולי</h1>
  <p>מי את/ה?</p>
  <div class="names" id="names"></div>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
  <header>
    <div class="h-row">
      <h1 id="userName">—</h1>
      <span class="h-actions">
        <button class="link" id="oversightBtn" hidden>בקרה</button>
        <button class="link" id="resetBtn">שיחה חדשה</button>
        <button class="link" id="logoutBtn">יציאה</button>
      </span>
      <span class="role" id="userRole"></span>
    </div>
  </header>

  <div id="chat"></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="כתוב/י הודעה…" autocomplete="off"></textarea>
    <button id="send" type="submit">שליחה</button>
  </form>
</div>

<div id="oversight" hidden>
  <button class="link close" id="ovClose">✕ סגירה</button>
  <div class="ov-wrap" id="ovBody"></div>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
async function api(path, opts) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("שגיאה " + r.status));
  return d;
}
const state = { user: null, history: [], busy: false };
const roleHe = { owner:"בעלים", project_manager:"מנהל פרויקט", planner:"שרטוט ותכנון", finance:"כספים", admin:"אדמין" };

/* ---------- login ---------- */
async function showLogin() {
  $("#app").hidden = true; $("#login").hidden = false;
  const box = $("#names"); box.innerHTML = "";
  let users;
  try {
    ({ users } = await api("/api/users"));
  } catch (e) {
    // כניסה רק דרך קישור אישי
    $("#login").querySelector("p:not(.brand)").textContent = "הכניסה למערכת היא דרך קישור אישי.";
    $("#loginErr").textContent = "פנה/י ליוכי לקבלת הקישור שלך.";
    return;
  }
  for (const u of users) {
    const b = el("button", "name-btn");
    b.append(document.createTextNode(u.name), el("small", null, roleHe[u.role] || u.role));
    b.onclick = () => login(u.key);
    box.appendChild(b);
  }
}
async function login(identifier) {
  $("#loginErr").textContent = "";
  try {
    const { user } = await api("/api/login", { method:"POST", body: JSON.stringify({ identifier }) });
    state.user = user; startApp();
  } catch (e) { $("#loginErr").textContent = e.message; }
}

/* ---------- history persistence ---------- */
const histKey = () => "opschat:" + state.user.key;
function loadHistory() {
  try { state.history = JSON.parse(localStorage.getItem(histKey()) || "[]"); }
  catch { state.history = []; }
}
function saveHistory() {
  try { localStorage.setItem(histKey(), JSON.stringify(state.history.slice(-40))); } catch {}
}

/* ---------- app ---------- */
function startApp() {
  $("#login").hidden = true; $("#app").hidden = false;
  $("#userName").textContent = state.user.name;
  $("#userRole").textContent = state.user.roleDescription || "";
  $("#oversightBtn").hidden = !state.user.canOversee;
  loadHistory();
  renderChat();
}
$("#logoutBtn").onclick = async () => { await api("/api/logout", { method:"POST" }); location.reload(); };
$("#resetBtn").onclick = () => { state.history = []; saveHistory(); renderChat(); };

function bubble(role, text) {
  const b = el("div", "msg " + (role === "user" ? "me" : "bot"));
  if (role === "user") { b.textContent = text; }
  else {
    // רינדור מינימלי: **מודגש** בלבד, שאר הטקסט כפשוטו
    const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
    b.innerHTML = esc(text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  $("#chat").appendChild(b);
  return b;
}
function scrollDown() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }

function renderChat() {
  const c = $("#chat"); c.innerHTML = "";
  const intro = el("div", "msg bot intro",
    "בוקר טוב 🌤️ אני העוזר התפעולי שלך. תגיד/י לי 'בוקר טוב' ואראה לך מה על הפרק היום, ועדכן/י אותי במהלך היום מה ביצעת — אני אדאג לרשום ב-Monday.");
  c.appendChild(intro);
  for (const m of state.history) bubble(m.role, m.content);
  if (state.history.length === 0) {
    const chips = el("div", "chips");
    for (const q of ["בוקר טוב", "מה יש לי היום?", "מה דחוף?"]) {
      const ch = el("button", "chip", q);
      ch.onclick = () => sendMessage(q);
      chips.appendChild(ch);
    }
    c.appendChild(chips);
  }
  scrollDown();
}

async function sendMessage(text) {
  text = (text ?? $("#input").value).trim();
  if (!text || state.busy) return;
  state.busy = true;
  $("#send").disabled = true;
  $("#input").value = "";
  $("#chat").querySelector(".chips")?.remove();

  state.history.push({ role: "user", content: text });
  bubble("user", text);
  const typing = el("div", "typing", "מקליד…");
  $("#chat").appendChild(typing);
  scrollDown();

  try {
    const { reply, actions } = await api("/api/chat", { method:"POST", body: JSON.stringify({ messages: state.history }) });
    typing.remove();
    if (actions && actions.length) {
      const box = el("div", "acts");
      for (const a of actions) box.appendChild(el("div", "act-note", a));
      $("#chat").appendChild(box);
    }
    bubble("assistant", reply);
    state.history.push({ role: "assistant", content: reply });
    saveHistory();
  } catch (e) {
    typing.remove();
    bubble("assistant", "משהו השתבש: " + e.message);
  } finally {
    state.busy = false;
    $("#send").disabled = false;
    $("#input").focus();
    scrollDown();
  }
}

$("#composer").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(); });
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("#input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 96) + "px";
});

/* ---------- oversight ---------- */
$("#oversightBtn").onclick = async () => {
  $("#oversight").hidden = false;
  const body = $("#ovBody"); body.innerHTML = "<p class='role'>טוען את מצב כל המשרד… (כמה שניות)</p>";
  try { renderOversight(await api("/api/oversight")); }
  catch (e) { body.innerHTML = ""; body.appendChild(el("p", "err", e.message)); }
};
$("#ovClose").onclick = () => { $("#oversight").hidden = true; };

function renderOversight(r) {
  const b = $("#ovBody"); b.innerHTML = "";
  const t = r.totals;
  b.appendChild(el("p", "role",
    `סה"כ ${t.openTasks} משימות פתוחות בצוות · ${t.overdue} באיחור · ${t.stuck} תקועות · ${t.projectsFlagged} פרויקטים דורשים תשומת לב`));

  b.appendChild(el("div", "sec-title", "עומס לכל אדם"));
  const sc = el("div", "scroll"); const tbl = el("table");
  tbl.innerHTML = "<thead><tr><th>שם</th><th>פתוחות</th><th>באיחור</th><th>תקועות</th><th>חוסם אחרים</th><th>להיום</th></tr></thead>";
  const tb = el("tbody");
  for (const p of r.people) {
    const tr = el("tr");
    tr.appendChild(el("td", null, p.name));
    for (const [k, hot] of [["open"],["overdue","h"],["stuck","h"],["blocking"],["dueToday"]]) {
      tr.appendChild(el("td", "num" + (hot && p.counts[k] > 0 ? " hot" : ""), String(p.counts[k])));
    }
    tb.appendChild(tr);
    if (p.worst.length) {
      const wr = el("tr"); const td = el("td"); td.colSpan = 6;
      td.style.cssText = "white-space:normal;font-size:.8rem;color:var(--ink-soft)";
      td.textContent = "הכי באיחור: " + p.worst.map(w => `${w.name} (${w.daysOverdue} י')`).join(" · ");
      wr.appendChild(td); tb.appendChild(wr);
    }
  }
  tbl.appendChild(tb); sc.appendChild(tbl); b.appendChild(sc);

  b.appendChild(el("div", "sec-title", `פרויקטים שדורשים תשומת לב (${r.projects.length})`));
  for (const p of r.projects) {
    const box = el("div", "proj");
    const top = el("div", "proj-top");
    top.append(el("span", null, p.name), el("span", "role", p.status));
    box.appendChild(top);
    box.appendChild(el("div", "proj-sub", `אחראי: ${p.owner}${p.deliveryDate ? " · מסירה: " + p.deliveryDate : ""}`));
    const ch = el("div", "pchips");
    for (const f of p.flags) ch.appendChild(el("span", "pchip" + (/תקוע|איחור/.test(f) ? " hot" : ""), f));
    box.appendChild(ch);
    b.appendChild(box);
  }
}

/* ---------- boot ---------- */
(async () => {
  try {
    const { user } = await api("/api/session");
    state.user = user;
    // מנקים את ה-token מסרגל הכתובת אחרי כניסה מוצלחת (הקישור המקורי עדיין יעבוד בפתיחה מחדש)
    if (location.search.includes("t=")) history.replaceState(null, "", location.pathname);
    startApp();
  } catch { showLogin(); }
})();
</script>
</body>
</html>
