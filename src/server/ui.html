<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העוזר התפעולי — גוטליב אדריכלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#F5F7F9; --surface:#FFFFFF; --surface-alt:#EEF2F5;
    --ink:#18242F; --ink-soft:#566673; --ink-faint:#8A98A3;
    --line:#D5DCE3; --line-strong:#A9B4BF;
    --accent:#2E6AAF; --accent-ink:#fff; --accent-soft:#e7eef7;
    --bubble-me:#2E6AAF; --bubble-bot:#FFFFFF;
    --overdue:#B23A3A; --overdue-soft:#f6e5e5;
    --warn:#A96A11; --warn-soft:#f5ecdd; --ok:#2C7A68;
    --shadow:0 1px 2px rgba(24,36,47,.05),0 8px 24px rgba(24,36,47,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0D141C; --surface:#151F29; --surface-alt:#1B2833;
      --ink:#E3E9EE; --ink-soft:#94A3AF; --ink-faint:#6C7B87;
      --line:#29373F; --line-strong:#3C4C55;
      --accent:#6FA8DD; --accent-ink:#0D141C; --accent-soft:#1c2c3c;
      --bubble-me:#2E6AAF; --bubble-bot:#1B2833;
      --overdue:#E4736B; --overdue-soft:#3a2422;
      --warn:#DBA654; --warn-soft:#332a1b; --ok:#5DB6A0;
      --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Heebo","Assistant",system-ui,sans-serif;line-height:1.6;display:flex;flex-direction:column}
  a{color:var(--accent)}
  [hidden]{display:none!important}
  button.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:.82rem;padding:0}

  /* ---------- login ---------- */
  .login{max-width:420px;margin:12vh auto 0;padding:0 1.2rem;text-align:center}
  .brand{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
  .login h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:2rem;margin:.2rem 0 .1rem}
  .login p{color:var(--ink-soft);margin-top:0}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.6rem 0}
  .name-btn{padding:.8rem;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;font:inherit;font-size:1rem;box-shadow:var(--shadow)}
  .name-btn:hover{border-color:var(--accent);color:var(--accent)}
  .name-btn small{display:block;color:var(--ink-faint);font-size:.72rem;margin-top:.15rem}
  .err{color:var(--overdue);font-size:.85rem;min-height:1.2em}

  /* ---------- app shell ---------- */
  #app{flex:1;display:flex;flex-direction:column;min-height:0;max-width:780px;width:100%;margin:0 auto}
  header{border-bottom:1.5px solid var(--line-strong);padding:.7rem clamp(.8rem,3vw,1.4rem) .6rem;background:var(--paper)}
  .h-row{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:1.25rem;margin:0}
  .role{color:var(--ink-soft);font-size:.82rem;flex:1 1 100%}
  .h-actions{display:flex;gap:.9rem;margin-inline-start:auto}

  /* ---------- chat ---------- */
  #chat{flex:1;overflow-y:auto;padding:1rem clamp(.8rem,3vw,1.4rem);display:flex;flex-direction:column;gap:.7rem}
  .msg{max-width:80%;padding:.55rem .85rem;border-radius:14px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);font-size:.95rem}
  .msg.me{align-self:flex-start;background:var(--bubble-me);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-end;background:var(--bubble-bot);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.bot.intro{border-style:dashed}
  /* פנייה יזומה של הבקרה — בולטת, עם פס צד */
  .msg.bot.nudge{align-self:flex-end;border-right:3px solid var(--accent);background:var(--surface-alt)}
  .msg.bot.nudge .nudge-tag{display:block;font-size:.7rem;letter-spacing:.04em;color:var(--accent);margin-bottom:.3rem}
  /* בקשת אישור למוטי — בולטת יותר מנודג' רגיל */
  .msg.bot.approval{align-self:flex-end;max-width:92%;border-right:3px solid var(--warn);background:var(--warn-soft)}
  .msg.bot.approval .nudge-tag{color:var(--warn)}
  .appr-btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .appr-btns .chip{background:var(--surface)}
  .appr-btns .appr-ok{border-color:var(--ok);color:var(--ok)}
  .appr-btns .appr-no{border-color:var(--overdue);color:var(--overdue)}
  .appr-instr{display:flex;gap:.4rem;margin-top:.5rem}
  .appr-instr textarea{flex:1;font:inherit;font-size:.85rem;padding:.4rem .6rem;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;min-height:2.2rem}
  .appr-err{color:var(--overdue);font-size:.8rem;margin-top:.4rem}
  .appr-thread{margin-top:.5rem;padding-top:.4rem;border-top:1px dashed var(--line-strong);display:flex;flex-direction:column;gap:.25rem}
  .appr-msg{font-size:.85rem}
  .appr-msg-mgr b{color:var(--warn)}
  .appr-msg-emp b{color:var(--accent)}
  #toast{position:fixed;inset-block-start:.8rem;inset-inline:0;margin:auto;width:max-content;max-width:90vw;
    background:var(--accent);color:#fff;padding:.5rem 1rem;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow);
    z-index:50;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
  #toast.show{opacity:1;transform:translateY(0)}
  .acts{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;gap:.25rem}
  .act-note{font-size:.78rem;color:var(--ok);background:var(--surface-alt);border-radius:8px;padding:.2rem .6rem}
  .typing{align-self:flex-end;color:var(--ink-faint);font-size:.85rem;padding:.3rem .5rem}
  .brk{align-self:center;font-size:.72rem;color:var(--ink-faint);letter-spacing:.06em;margin:.6rem 0;padding:.1rem .8rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);width:100%;text-align:center}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;align-self:flex-end;margin-top:.2rem}
  .chip{font:inherit;font-size:.82rem;padding:.25rem .7rem;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- composer ---------- */
  form{display:flex;gap:.5rem;padding:.7rem clamp(.8rem,3vw,1.4rem);border-top:1.5px solid var(--line-strong);background:var(--paper)}
  #input{flex:1;font:inherit;font-size:.95rem;padding:.55rem .8rem;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);resize:none;max-height:6rem}
  #send{flex:0 0 auto;font:inherit;padding:0 1.1rem;border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
  #send:disabled{opacity:.5;cursor:default}

  /* ---------- oversight overlay ---------- */
  #oversight,#history,#notifOverlay{position:fixed;inset:0;background:var(--paper);overflow-y:auto;padding:1.2rem clamp(.8rem,4vw,2rem) 3rem;z-index:10}
  #oversight .close,#history .close,#notifOverlay .close{position:sticky;top:0;margin-inline-start:auto;display:block}
  .ov-wrap{max-width:860px;margin:0 auto}
  #histList{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
  .hist-row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
  .hist-row:hover{border-color:var(--accent)}
  .hist-row.current{border-inline-start:3px solid var(--accent)}
  .hist-main{flex:1;text-align:right;background:none;border:none;font:inherit;cursor:pointer;padding:.7rem .9rem;color:var(--ink)}
  .hist-del{flex:0 0 auto;background:none;border:none;border-inline-start:1px solid var(--line);color:var(--ink-faint);font:inherit;font-size:.8rem;cursor:pointer;padding:0 .85rem}
  .hist-del:hover{background:var(--overdue-soft);color:var(--overdue)}
  .hist-title{font-weight:600;font-size:.95rem;color:var(--ink)}
  .hist-meta{font-size:.78rem;color:var(--ink-faint);margin-top:.15rem}
  .sec-title{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:1.15rem;margin:1.6rem 0 .4rem}
  .scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{text-align:right;padding:.5rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{background:var(--surface-alt);font-size:.78rem;color:var(--ink-soft);border-bottom:1.5px solid var(--line-strong)}
  td.num{font-variant-numeric:tabular-nums;text-align:center}
  td.num.hot{color:var(--overdue);font-weight:700}
  .proj{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--warn);border-radius:3px;padding:.6rem .9rem;margin-bottom:.5rem;box-shadow:var(--shadow)}
  .proj-top{display:flex;justify-content:space-between;gap:1rem;font-weight:600}
  .proj-sub{font-size:.82rem;color:var(--ink-soft);margin-top:.15rem}
  .pchips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
  .pchip{font-size:.75rem;padding:.1rem .5rem;border-radius:999px;background:var(--surface-alt);color:var(--ink-soft)}
  .pchip.hot{background:var(--overdue-soft);color:var(--overdue);font-weight:600}

  #notif{margin-top:.8rem;display:flex;flex-direction:column;gap:.5rem}
  #notifBtn.has{color:var(--overdue);font-weight:700}
  .nt{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:.6rem .8rem;font-size:.9rem;white-space:pre-wrap}
  .nt.briefing{background:var(--accent-soft);border-color:var(--accent)}
  .nt.nudge{background:var(--accent-soft);border-color:var(--accent)}
  .nt-head{font-weight:700;font-size:.8rem;margin-bottom:.2rem}
  #notif .dismiss{align-self:flex-start;font:inherit;font-size:.8rem;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}
  .nt .dismiss{margin-top:.4rem;font-weight:600}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <p class="brand">גוטליב אדריכלים · סוכן תפעול</p>
  <h1>העוזר התפעולי</h1>
  <p>מי את/ה?</p>
  <div class="names" id="names"></div>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
  <header>
    <div class="h-row">
      <h1 id="userName">—</h1>
      <span class="h-actions">
        <button class="link" id="notifBtn" hidden>התראות</button>
        <button class="link" id="oversightBtn" hidden>בקרה</button>
        <button class="link" id="historyBtn">היסטוריית שיחות</button>
        <button class="link" id="resetBtn">שיחה חדשה</button>
        <button class="link" id="logoutBtn">יציאה</button>
      </span>
      <span class="role" id="userRole"></span>
    </div>
  </header>

  <div id="chat"></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="כתוב/י הודעה…" autocomplete="off"></textarea>
    <button id="send" type="submit">שליחה</button>
  </form>
</div>

<div id="history" hidden>
  <button class="link close" id="histClose">✕ סגירה</button>
  <div class="ov-wrap">
    <h2 class="sec-title" style="margin-top:.5rem">היסטוריית שיחות</h2>
    <div id="histList"></div>
  </div>
</div>

<div id="notifOverlay" hidden>
  <button class="link close" id="notifClose">✕ סגירה</button>
  <div class="ov-wrap">
    <h2 class="sec-title" style="margin-top:.5rem">התראות ותזכורות</h2>
    <div id="notif"></div>
  </div>
</div>

<div id="oversight" hidden>
  <button class="link close" id="ovClose">✕ סגירה</button>
  <div class="ov-wrap" id="ovBody"></div>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
async function api(path, opts) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("שגיאה " + r.status));
  return d;
}
// activeNudge = הפנייה (אם יש) שהמשתמש בחר במפורש לטפל בה בשיחה הנוכחית — היחידה שמוצגת בגוף
// הצ'אט. state.nudges (כל הפניות הפתוחות) מוצג רק באזור "התראות", לא בתוך שום שיחה.
const state = { user: null, session: null, thread: [], busy: false, nudges: [], activeNudge: null, approvals: [], es: null };
function fmtDate(iso) {
  if (!iso) return "?";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? `${m[3]}/${m[2]}` : iso;
}
/* ביפ קצר, Web Audio API בלבד — רק כשמגיע approval חדש בזמן אמת (לא ב-load רגיל). */
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.36);
    setTimeout(() => { try { ctx.close(); } catch {} }, 500);
  } catch {}
}

/* ---------- פניות יזומות של הבקרה ---------- */
let toastEl = null;
function toast(msg) {
  if (!toastEl) { toastEl = el("div"); toastEl.id = "toast"; document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 4000);
}
async function loadNudges() {
  try {
    const { nudges } = await api("/api/nudges");
    state.nudges = nudges || [];
  } catch { state.nudges = []; }
}
function addNudge(n) {
  if (state.nudges.some(x => x.id === n.id)) return;
  state.nudges.push({ id: n.id, body: n.body, findingKey: n.findingKey, itemId: n.itemId, source: n.source || n.itemSource, taskName: n.taskName, currentDueDateISO: n.currentDueDateISO ?? null, approvalId: n.approvalId ?? null, missedCommitment: n.missedCommitment === true });
  // לא מוזרק לגוף השיחה — רק מעדכן את הבאדג'/overlay של "התראות". ר' loadNotifications.
  loadNotifications();
  toast("📌 פנייה חדשה מהבקרה");
}
/** שאלה/הנחיה חיה של מוטי מתוך Approval — מוצגת בדיוק כמו נודג', עם approvalId שממשיך לזרום
 *  עם about. לא ביפ (זה למוטי, לא לעובד) — רק toast, כמו נודג' רגיל. */
function addApprovalQuestionNudge(n) {
  if (state.nudges.some(x => x.id === n.id)) return;
  const ctx = n.context || {};
  state.nudges.push({ id: n.id, body: n.body, findingKey: n.findingKey, itemId: n.itemId, source: n.itemSource, taskName: null, currentDueDateISO: null, approvalId: ctx.approvalId ?? null });
  loadNotifications();
  toast("🧑‍⚖️ מוטי מבקש פרטים");
}
/** תשובת עובד הגיעה חיה למוטי — מרעננים את כל רשימת האישורים (כולל היסטוריית ההודעות) ומרנדרים. */
function onApprovalReplyLive(n) {
  loadApprovals().then(() => { renderChat(); beep(); toast(n.body ? ("💬 " + n.body) : "💬 העובד ענה"); });
}
/** notification גנרי (או approval_instruction לעובד) שהגיע חי דרך SSE. */
function onLiveNotification(n) {
  if (n.kind === "approval_instruction") { addApprovalQuestionNudge(n); return; }
  loadNotifications();
  if (n.body) toast(n.body.length > 90 ? n.body.slice(0, 90) + "…" : n.body);
}
/* ---------- אישורים למוטי ---------- */
async function loadApprovals() {
  if (!state.user || !state.user.canApprove) { state.approvals = []; return; }
  try {
    const { approvals } = await api("/api/approvals");
    state.approvals = (approvals || []).filter(a => a.status === "pending" || a.status === "pending_instruction");
  } catch { state.approvals = []; }
}
/** approval חדש שמגיע חי דרך SSE — לא ב-load הראשוני, ולכן כן משמיע ביפ ומראה toast. */
function addApprovalLive(n) {
  const ctx = n.context || {};
  if (!ctx.approvalId || state.approvals.some(a => a.id === ctx.approvalId)) return;
  state.approvals.push({
    id: ctx.approvalId, status: "pending", kind: ctx.kind || "deferral",
    requestedBy: ctx.requestedBy, requestedByName: ctx.requestedByName, taskName: ctx.taskName,
    itemId: n.itemId, itemSource: n.itemSource, messages: [],
    payload: { oldDueDate: ctx.oldDueDate, requestedNewDueDate: ctx.requestedNewDueDate, reason: ctx.reason, priorDeferrals: ctx.priorDeferrals, ruleId: ctx.ruleId },
  });
  renderChat();
  beep();
  toast("🔔 נדרש אישור חדש");
}
function approvalCard(a) {
  const wrap = el("div", "msg bot approval");
  wrap.appendChild(el("span", "nudge-tag", "🔔 נדרש אישור"));
  const p = a.payload || {};
  const requester = a.requestedByName || a.requestedBy;
  if (a.kind === "cancellation") {
    // audit 2026-09-17/20: אותו כרטיס, ניסוח נפרד — payload של ביטול הוא {reason,ruleId} בלבד,
    // אין oldDueDate/requestedNewDueDate/priorDeferrals (אלה שדות של דחייה בלבד).
    wrap.appendChild(document.createTextNode(
      `${requester} מבקש/ת לבטל / לסמן כלא רלוונטית את המשימה "${a.taskName || a.itemId}".`,
    ));
    if (p.reason) {
      wrap.appendChild(el("br")); wrap.appendChild(document.createTextNode(`סיבה: ${p.reason}`));
    }
  } else {
    wrap.appendChild(document.createTextNode(
      `${requester} מבקש/ת לדחות את המשימה "${a.taskName || a.itemId}" מ-${fmtDate(p.oldDueDate)} ל-${fmtDate(p.requestedNewDueDate)}.`,
    ));
    if (p.reason) {
      wrap.appendChild(el("br")); wrap.appendChild(document.createTextNode(`סיבה: ${p.reason}`));
    }
    const priorCount = p.priorDeferrals ? (p.priorDeferrals.beforeOverdue || 0) + (p.priorDeferrals.afterOverdue || 0) : 0;
    wrap.appendChild(el("br")); wrap.appendChild(document.createTextNode(`דחיות קודמות: ${priorCount}.`));
  }

  // התכתבות קצרה — שאלה/הנחיה של מוטי ותשובת העובד, לפי הסדר. מוטי לא צריך "לחפש את העובד
  // בצ'אט נפרד" — הכל כאן, בתוך הכרטיס.
  if (a.messages && a.messages.length) {
    const thread = el("div", "appr-thread");
    for (const m of a.messages) {
      const row = el("div", "appr-msg " + (m.senderRole === "manager" ? "appr-msg-mgr" : "appr-msg-emp"));
      const who = el("b", null, m.senderRole === "manager" ? "מוטי: " : "העובד: ");
      row.appendChild(who);
      row.appendChild(document.createTextNode(m.message));
      thread.appendChild(row);
    }
    wrap.appendChild(thread);
  }

  const errBox = el("div", "appr-err"); errBox.hidden = true;
  const showErr = (msg) => { errBox.textContent = msg; errBox.hidden = false; };

  const okBtn = el("button", "chip appr-ok", "✓ אשר");
  const noBtn = el("button", "chip appr-no", "✕ לא");
  const moreBtn = el("button", "chip appr-more", a.messages && a.messages.length ? "💬 שאל שוב / הנחיה אחרת" : "💬 פרטים / הנחיה אחרת");
  const instrBox = el("div", "appr-instr"); instrBox.hidden = true;
  const instrInput = document.createElement("textarea"); instrInput.rows = 2; instrInput.placeholder = "מה ההנחיה?";
  const instrSend = el("button", "chip", "שלח");
  instrBox.append(instrInput, instrSend);

  const removeCard = () => { state.approvals = state.approvals.filter(x => x.id !== a.id); renderChat(); };
  const setBusy = (b) => { okBtn.disabled = noBtn.disabled = moreBtn.disabled = b; };

  okBtn.onclick = async () => {
    setBusy(true); errBox.hidden = true;
    try {
      await api(`/api/approvals/${a.id}/approve`, { method: "POST", body: JSON.stringify({}) });
      toast("✓ אושר ועודכן ב-Monday");
      removeCard();
    } catch (e) { showErr("האישור לא בוצע בפועל: " + e.message); setBusy(false); }
  };
  noBtn.onclick = async () => {
    setBusy(true); errBox.hidden = true;
    try {
      await api(`/api/approvals/${a.id}/reject`, { method: "POST", body: JSON.stringify({}) });
      toast("✕ הבקשה נדחתה");
      removeCard();
    } catch (e) { showErr(e.message); setBusy(false); }
  };
  moreBtn.onclick = () => { instrBox.hidden = !instrBox.hidden; if (!instrBox.hidden) instrInput.focus(); };
  instrSend.onclick = async () => {
    const text = instrInput.value.trim();
    if (!text) return;
    instrSend.disabled = true; errBox.hidden = true;
    try {
      await api(`/api/approvals/${a.id}/instruction`, { method: "POST", body: JSON.stringify({ instruction: text }) });
      instrInput.value = "";
      toast("ההנחיה נשלחה לעובד");
      await loadApprovals(); renderChat(); // מרענן כדי שההודעה של מוטי עצמו תופיע מיד בהתכתבות
    } catch (e) { showErr(e.message); instrSend.disabled = false; }
  };

  const btns = el("div", "appr-btns");
  btns.append(okBtn, noBtn, moreBtn);
  wrap.append(btns, instrBox, errBox);
  return wrap;
}

function openEventStream() {
  try { state.es?.close(); } catch {}
  const es = new EventSource("/api/events");
  state.es = es;
  es.addEventListener("nudge", (e) => { try { addNudge(JSON.parse(e.data)); } catch {} });
  es.addEventListener("approval", (e) => { try { addApprovalLive(JSON.parse(e.data)); } catch {} });
  es.addEventListener("approval_update", (e) => { try { onApprovalReplyLive(JSON.parse(e.data)); } catch {} });
  es.addEventListener("notification", (e) => { try { onLiveNotification(JSON.parse(e.data)); } catch {} });
  es.onerror = () => { /* EventSource מתחבר מחדש לבד */ };
}
const roleHe = { owner:"בעלים", project_manager:"מנהל פרויקט", planner:"שרטוט ותכנון", finance:"כספים", admin:"אדמין" };

/* ---------- login ---------- */
async function showLogin() {

async function login(identifier) {

/* ---------- sessions (server-side) ---------- */
// state.session = מזהה השיחה הנוכחית · state.thread = ההודעות שלה
async function loadSession(id) {
  try {
    const { messages } = await api("/api/chat/session?id=" + encodeURIComponent(id));
    state.session = id;
    state.thread = messages.map(m => ({ role: m.role, content: m.content, actions: m.actions || [] }));
  } catch { state.thread = []; }
}
function activeContext() {
  return state.thread.filter(m => m.role === "user" || m.role === "assistant").slice(-20);
}

/* ---------- app ---------- */
async function startApp() {
  $("#login").hidden = true; $("#app").hidden = false;
  $("#userName").textContent = state.user.name;
  $("#userRole").textContent = state.user.roleDescription || "";
  $("#oversightBtn").hidden = !(state.user.canOversee || state.user.canFinance);
  try {
    const { latest } = await api("/api/chat/sessions");
    if (latest) await loadSession(latest);
  } catch {}
  await loadApprovals();
  renderChat();
  loadNotifications(); // טוען גם את הפניות הפתוחות (state.nudges) — לבאדג'/overlay בלבד, לא לגוף השיחה
  openEventStream();
}

async function renderHistory() {
  const box = $("#histList"); box.innerHTML = "<p class='role'>טוען…</p>";
  try {
    const { sessions } = await api("/api/chat/sessions");
    box.innerHTML = "";
    if (!sessions.length) { box.appendChild(el("p", "empty", "אין שיחות שמורות עדיין")); return; }
    for (const s of sessions) {
      const row = el("div", "hist-row");
      if (s.id === state.session) row.classList.add("current");
      const main = el("button", "hist-main");
      main.appendChild(el("div", "hist-title", s.title));
      const d = new Date(s.lastAt.replace(" ", "T") + "Z");
      main.appendChild(el("div", "hist-meta", d.toLocaleString("he-IL", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) + ` · ${s.count} הודעות`));
      main.onclick = async () => {
        await loadSession(s.id);
        state.activeNudge = null;
        $("#history").hidden = true;
        renderChat();
      };
      const del = el("button", "hist-del", "מחק");
      del.title = "מחיקת השיחה";
      del.onclick = async () => {
        if (!confirm(`למחוק את השיחה "${s.title}"? אי אפשר לשחזר.`)) return;
        try {
          await api("/api/chat/session/delete", { method: "POST", body: JSON.stringify({ id: s.id }) });
          if (s.id === state.session) { state.session = null; state.thread = []; state.activeNudge = null; renderChat(); }
          renderHistory();
        } catch (e) { alert(e.message); }
      };
      row.append(main, del);
      box.appendChild(row);
    }
  } catch (e) { box.innerHTML = ""; box.appendChild(el("p", "err", e.message)); }
}
$("#historyBtn").onclick = () => { $("#history").hidden = false; renderHistory(); };
$("#histClose").onclick = () => { $("#history").hidden = true; };

const NT_HEAD = { reminder:"תזכורת מהבקרה", escalation:"הסלמה", briefing:"תדריך הבוקר", weekly:"דוח שבועי", approval_request:"נדרש אישור", manager_decision:"תשובה ממוטי", awaiting_decision:"ממתין להחלטתך" };
// kinds שיכולים לשאת itemId+itemSource+findingKey אמיתיים (לא מומצא) — הכפתור עצמו מותנה בבדיקה
// נוספת בזמן רינדור (n.itemId && n.itemSource && n.findingKey), כי גם בתוך kind actionable ייתכנו
// שורות ישנות/חלקיות (למשל escalation שנוצרה לפני 2026-09-15, לפני שה-backend צירף context — ר'
// escalationNotifContext ב-escalation.ts). briefing/weekly נשארים בחוץ: סיכום כללי, לא פריט בודד.
const ACTIONABLE_NOTIF_KINDS = new Set(["manager_decision", "awaiting_decision", "escalation"]);
/** ממיר notification גנרי (מ-/api/notifications) לאותה צורת אובייקט ש-openNudgeInChat/sendMessage
 *  כבר יודעים לצרוך (זהה למה ש-/api/nudges מחזיר) — בלי להמציא שדה שלא קיים בפועל. */
function notificationToLoopContext(n) {
  const ctx = n.context || {};
  return {
    id: n.id, body: n.body, findingKey: n.findingKey, itemId: n.itemId, source: n.itemSource,
    taskName: ctx.taskName ?? null, currentDueDateISO: ctx.currentDueDateISO ?? null,
    approvalId: ctx.approvalId ?? null, missedCommitment: ctx.missedCommitment === true,
  };
}
/** כרטיס פנייה פתוחה בתוך overlay ה"התראות" — עם כפתור מפורש לפתיחה בשיחה נקייה. הפנייה
 *  עצמה לא נמחקת/נעלמת כאן; היא נשארת "פתוחה" עד שנפתרת בפועל (תשובה בשיחה). */
function nudgeCard(n) {
  const d = el("div", "nt nudge");
  d.appendChild(el("div", "nt-head", n.approvalId ? "🧑‍⚖️ שאלה ממוטי" : "📌 פנייה מהבקרה"));
  d.appendChild(document.createTextNode(n.body));
  d.appendChild(el("br"));
  const btn = el("button", "dismiss", "טיפול בשיחה ←");
  btn.onclick = () => openNudgeInChat(n);
  d.appendChild(btn);
  return d;
}
/** בחירה מפורשת של המשתמש בפנייה מהבקרה — פותחת שיחה נקייה חדשה עם ההקשר הזה בלבד,
 *  שומרת את ה-context (itemId/source/findingKey/...) לשליחה הבאה דרך state.activeNudge. */
function openNudgeInChat(n) {
  state.session = null;
  state.thread = [];
  state.activeNudge = n;
  $("#notifOverlay").hidden = true;
  renderChat();
  $("#input").focus();
}
// ההתראות ופניות הבקרה הפתוחות לא נכנסות לגוף שום שיחה — רק לכפתור "התראות (N)" בכותרת
// שפותח overlay נפרד (nudgeCard/הכפתור בכרטיס מאפשרים לעבור משם לשיחה במפורש).
async function loadNotifications() {
  await loadNudges();
  const box = $("#notif"); box.innerHTML = "";
  const btnTop = $("#notifBtn");
  let list;
  try { ({ notifications: list } = await api("/api/notifications")); }
  catch { list = []; }
  const total = list.length + state.nudges.length;
  if (!total) {
    btnTop.hidden = true;
    box.appendChild(el("p", "empty", "אין התראות חדשות 👌"));
    return;
  }
  btnTop.hidden = false;
  btnTop.textContent = `התראות (${total})`;
  btnTop.classList.add("has");
  for (const n of state.nudges) box.appendChild(nudgeCard(n));
  for (const n of list) {
    const d = el("div", "nt" + (n.kind === "briefing" ? " briefing" : ""));
    d.appendChild(el("div", "nt-head", NT_HEAD[n.kind] || "הודעה"));
    d.appendChild(document.createTextNode(n.body));
    // כפתור "טיפול בשיחה" רק כשיש בפועל itemId+itemSource+findingKey על ההתראה הזו (לא מומצא) —
    // ר' ACTIONABLE_NOTIF_KINDS למעלה.
    if (ACTIONABLE_NOTIF_KINDS.has(n.kind) && n.itemId && n.itemSource && n.findingKey) {
      d.appendChild(el("br"));
      const openBtn = el("button", "dismiss", "טיפול בשיחה ←");
      openBtn.onclick = () => openNudgeInChat(notificationToLoopContext(n));
      d.appendChild(openBtn);
    }
    box.appendChild(d);
  }
  const btn = el("button", "dismiss", "סמן הכל כנקרא");
  btn.onclick = async () => {
    await api("/api/notifications/seen", { method:"POST" });
    $("#notifOverlay").hidden = true;
    loadNotifications();
  };
  box.appendChild(btn);
}
$("#notifBtn").onclick = () => { $("#notifOverlay").hidden = false; };
$("#notifClose").onclick = () => { $("#notifOverlay").hidden = true; };
$("#logoutBtn").onclick = async () => { await api("/api/logout", { method:"POST" }); location.reload(); };
$("#resetBtn").onclick = () => {

function bubble(role, text) {
  const b = el("div", "msg " + (role === "user" ? "me" : "bot"));
  if (role === "user") { b.textContent = text; }
  else {
    // רינדור מינימלי: **מודגש** בלבד, שאר הטקסט כפשוטו
    const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
    b.innerHTML = esc(text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  $("#chat").appendChild(b);
  return b;
}
function scrollDown() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }

function renderChat() {
  const c = $("#chat"); c.innerHTML = "";
  const intro = el("div", "msg bot intro",
    "בוקר טוב 🌤️ אני העוזר התפעולי שלך. תגיד/י לי 'בוקר טוב' ואראה לך מה על הפרק היום, ועדכן/י אותי במהלך היום מה ביצעת — אני אדאג לרשום ב-Monday.");
  c.appendChild(intro);
  for (const m of state.thread) {
    if (m.actions && m.actions.length && m.role === "assistant") {
      const box = el("div", "acts");
      for (const a of m.actions) box.appendChild(el("div", "act-note", a));
      c.appendChild(box);
    }
    bubble(m.role, m.content);
  }
  // הפנייה שהמשתמש בחר במפורש לטפל בה (מתוך "התראות") — היחידה שמוצגת כבועת עוזר בשיחה.
  // שאר הפניות הפתוחות לא מוזרקות לכאן בכלל, ר' loadNotifications/nudgeCard.
  if (state.activeNudge) {
    const n = state.activeNudge;
    const b = el("div", "msg bot nudge");
    b.appendChild(el("span", "nudge-tag", n.approvalId ? "🧑‍⚖️ שאלה ממוטי" : "📌 פנייה מהבקרה"));
    b.appendChild(document.createTextNode(n.body));
    c.appendChild(b);
  }
  // בקשות אישור פתוחות (מוטי בלבד) — כרטיס בולט עם כפתורי הכרעה
  for (const a of state.approvals) c.appendChild(approvalCard(a));
  if (state.thread.length === 0 && !state.activeNudge && state.approvals.length === 0) {
    const chips = el("div", "chips");
    for (const q of ["בוקר טוב", "מה יש לי היום?", "מה דחוף?"]) {
      const ch = el("button", "chip", q);
      ch.onclick = () => sendMessage(q);
      chips.appendChild(ch);
    }
    c.appendChild(chips);
  } else if (state.activeNudge) {
    const hint = el("div", "chips");
    hint.appendChild(el("small", "role", "אפשר לענות כאן: סיימתי · צריך עוד יומיים · מחכה ליועץ · תקוע כי…"));
    c.appendChild(hint);
  }
  scrollDown();
}

async function sendMessage(text) {
  text = (text ?? $("#input").value).trim();
  if (!text || state.busy) return;
  state.busy = true;
  $("#send").disabled = true;
  $("#input").value = "";
  $("#chat").querySelector(".chips")?.remove();

  state.thread.push({ role: "user", content: text });
  bubble("user", text);
  const typing = el("div", "typing", "מקליד…");
  $("#chat").appendChild(typing);
  scrollDown();

  try {
    const ctx = [...activeContext()];
    // רק פנייה שהמשתמש בחר במפורש לטפל בה (activeNudge) נשלחת כ-about — לא "הפנייה
    // הפתוחה האחרונה בעולם", כדי לא לערבב הקשר של פנייה שלא נבחרה בשיחה הזו.
    const openNudge = state.activeNudge;
    const about = openNudge && openNudge.itemId && openNudge.findingKey
      ? { itemId: openNudge.itemId, source: openNudge.source, findingKey: openNudge.findingKey, taskName: openNudge.taskName, currentDueDateISO: openNudge.currentDueDateISO ?? null, approvalId: openNudge.approvalId ?? undefined, missedCommitment: openNudge.missedCommitment === true }
      : undefined;
    const { reply, actions, session } = await api("/api/chat", { method:"POST", body: JSON.stringify({ messages: ctx, session: state.session, about }) });
    state.session = session;
    typing.remove();
    if (actions && actions.length) {
      const box = el("div", "acts");
      for (const a of actions) box.appendChild(el("div", "act-note", a));
      $("#chat").appendChild(box);
    }
    bubble("assistant", reply);
    state.thread.push({ role: "assistant", content: reply, actions: actions || [] });
    // הפנייה הפעילה אולי נפתרה בשרת (תשובה סגרה את ה-finding) — מרעננים ובודקים אם היא
    // עדיין ברשימת הפתוחות; אם לא, מסירים אותה מהשיחה (state.activeNudge בלבד, לא נמחקת בשרת).
    if (state.activeNudge) {
      await loadNotifications();
      if (!state.nudges.some(x => x.id === state.activeNudge.id)) state.activeNudge = null;
      renderChat();
    }
  } catch (e) {
    typing.remove();
    bubble("assistant", "משהו השתבש: " + e.message);
  } finally {
    state.busy = false;
    $("#send").disabled = false;
    $("#input").focus();
    scrollDown();
  }
}

$("#composer").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(); });
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("#input").addEventListener("input", (e) => {

const SEV = { critical:"🔴", high:"🟠", normal:"⚪" };

function findingCard(f) {
  const box = el("div", "proj");
  box.style.borderInlineStartColor = f.severity === "critical" ? "var(--overdue)" : "var(--warn)";
  const top = el("div", "proj-top");
  top.append(el("span", null, `${SEV[f.severity]} ${f.headline}`), el("span", "role", f.who));
  box.appendChild(top);
  box.appendChild(el("div", "proj-sub", f.detail));
  if (f.url) { const a = el("a", null, "פתח ב-Monday ↗"); a.href = f.url; a.target = "_blank"; a.style.fontSize = ".82rem"; box.appendChild(a); }
  return box;
}

function renderCommitments(list) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", `התחייבויות ללקוחות (${list.length})`));
  const today = new Date().toISOString().slice(0, 10);
  for (const c of list) {
    const box = el("div", "proj");
    const late = c.dueDate && c.dueDate < today;
    box.style.borderInlineStartColor = late ? "var(--overdue)" : "var(--warn)";
    const top = el("div", "proj-top");
    top.append(el("span", null, `${c.toWhom} — ${c.what}`), el("span", "role", c.by));
    box.appendChild(top);
    box.appendChild(el("div", "proj-sub", (c.dueDate ? (late ? "באיחור · יעד " : "יעד ") + c.dueDate : "בלי תאריך") + (c.project ? ` · ${c.project}` : "")));
    b.appendChild(box);
  }
}

function renderCrm(r) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", "מכירות וכספים"));
  b.appendChild(el("p", "role", `${r.counts.critical} קריטי · ${r.counts.high} דחוף · ${r.counts.normal} נוסף`));
  const groups = { "גבייה": [], "מכירות": [], "לידים": [] };
  for (const f of r.findings) (groups[f.project] || (groups[f.project] = [])).push(f);
  for (const [area, list] of Object.entries(groups)) {
    if (!list.length) continue;
    b.appendChild(el("div", "proj-sub", `${area} — ${list.length}`)).style.fontWeight = "700";
    for (const f of list.filter(x => x.severity !== "normal")) b.appendChild(findingCard(f));
    const rest = list.filter(x => x.severity === "normal");
    if (rest.length) {
      const d = el("details"); d.style.margin = ".3rem 0 1rem";
      d.appendChild(el("summary", "role", `עוד ${rest.length} ב${area} (לא דחוף)`));
      for (const f of rest) d.appendChild(el("div", "proj-sub", `⚪ ${f.headline} — ${f.who}`));
      b.appendChild(d);
    }
  }
}

function renderControl(r) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", "בקרה יזומה — פרויקטים ומשימות"));
  b.appendChild(el("p", "role",
    `${r.counts.critical} קריטי · ${r.counts.high} דחוף · ${r.counts.normal} נוסף`));
  if (r.forManager.length === 0) {
    b.appendChild(el("p", "empty", "אין ממצאים קריטיים או דחופים 👌"));
  }
  for (const f of r.forManager) b.appendChild(findingCard(f));
  const rest = r.findings.filter(f => f.severity === "normal");
  if (rest.length) {
    const d = el("details"); d.style.margin = ".6rem 0 1rem";
    d.appendChild(el("summary", "role", `עוד ${rest.length} ממצאים (לא דחופים)`));
    for (const f of rest) d.appendChild(el("div", "proj-sub", `${SEV[f.severity]} ${f.headline} — ${f.who}`));
    b.appendChild(d);
  }
}

function renderOversight(r) {
  const b = $("#ovBody");
  const t = r.totals;
  b.appendChild(el("div", "sec-title", "עומס לכל אדם"));
  b.appendChild(el("p", "role",
    `סה"כ ${t.openTasks} משימות פתוחות בצוות · ${t.overdue} באיחור · ${t.stuck} תקועות`));

  const sc = el("div", "scroll"); const tbl = el("table");
  tbl.innerHTML = "<thead><tr><th>שם</th><th>פתוחות</th><th>באיחור</th><th>תקועות</th><th>חוסם אחרים</th><th>להיום</th></tr></thead>";
  const tb = el("tbody");
  for (const p of r.people) {
    const tr = el("tr");
    tr.appendChild(el("td", null, p.name));
    for (const [k, hot] of [["open"],["overdue","h"],["stuck","h"],["blocking"],["dueToday"]]) {
      tr.appendChild(el("td", "num" + (hot && p.counts[k] > 0 ? " hot" : ""), String(p.counts[k])));
    }
    tb.appendChild(tr);
    if (p.worst.length) {
      const wr = el("tr"); const td = el("td"); td.colSpan = 6;
      td.style.cssText = "white-space:normal;font-size:.8rem;color:var(--ink-soft)";
      td.textContent = "הכי באיחור: " + p.worst.map(w => `${w.name} (${w.daysOverdue} י')`).join(" · ");
      wr.appendChild(td); tb.appendChild(wr);
    }
  }
  tbl.appendChild(tb); sc.appendChild(tbl); b.appendChild(sc);

  b.appendChild(el("div", "sec-title", `פרויקטים שדורשים תשומת לב (${r.projects.length})`));
  for (const p of r.projects) {
    const box = el("div", "proj");
    const top = el("div", "proj-top");
    top.append(el("span", null, p.name), el("span", "role", p.status));
    box.appendChild(top);
    box.appendChild(el("div", "proj-sub", `אחראי: ${p.owner}${p.deliveryDate ? " · מסירה: " + p.deliveryDate : ""}`));
    const ch = el("div", "pchips");
    for (const f of p.flags) ch.appendChild(el("span", "pchip" + (/תקוע|איחור/.test(f) ? " hot" : ""), f));
    box.appendChild(ch);
    b.appendChild(box);
  }
}

/* ---------- boot ---------- */
(async () => {
  try {
    const { user } = await api("/api/session");
    state.user = user;
    // מנקים את ה-token מסרגל הכתובת אחרי כניסה מוצלחת (הקישור המקורי עדיין יעבוד בפתיחה מחדש)
    if (location.search.includes("t=")) history.replaceState(null, "", location.pathname);
    startApp();
  } catch { showLogin(); }
})();
</script>
