<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ManagerAgent — גוטליב אדריכלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* ===== Design tokens (Minimal Professional) ===== */
:root{
  --font-family:'Heebo',system-ui,sans-serif;
  --font-size-base:15px; --font-size-sm:14px; --font-size-xs:13px; --font-size-2xs:12px;
  --line-height:1.6; --line-height-mobile:1.55;

  --color-bg:#FBFBFA; --color-surface:#FFFFFF; --color-surface-muted:#F6F6F4;
  --color-sidebar-bg:#F3F3F1; --color-nav-active:#E5E5E1; --color-search-bg:#EAEAE7;
  --color-avatar-bg:#DCDCD7; --color-user-bubble:#EFEFEC; --color-skeleton:#EDEDEA;

  --color-text:#1C1D1F; --color-text-secondary:#3C4043; --color-text-muted:#5F6368;
  --color-text-subtle:#6B6F74; --color-text-inverse:#FBFBFA; --color-link:#1F4FA3;

  --color-border:#E6E6E3; --color-border-soft:#EDEDEA; --color-border-input:#DCDCD8;
  --color-border-sidebar-footer:#E2E2DE;

  --color-primary:#1C1D1F; --color-on-primary:#FFFFFF;

  --status-progress-fg:#1F4FA3; --status-progress-dot:#2F66C9;
  --status-waiting-fg:#7A4F00;  --status-waiting-dot:#D49B2B;
  --status-done-fg:#24683F;     --status-done-dot:#3A9A60;
  --status-late-fg:#A8231A;     --status-late-dot:#D33A2C;
  --status-todo-fg:#5F6368;     --status-todo-dot:#A0A4A8;
  --status-online-dot:#3A9A60;

  --approval-border:#D5DBE8; --approval-head-bg:#F2F5FB; --approval-head-fg:#1F3F82;

  --success-bg:#EEF6F0; --success-border:#CFE5D6; --success-icon:#24683F; --success-title:#1D5634; --success-text:#2F4A39;
  --error-bg:#FCF1EF; --error-border:#F0D2CD; --error-icon:#A8231A; --error-title:#8E1D15; --error-text:#5A2E29; --error-btn-border:#E2B8B1;

  --radius-sm:8px; --radius-md:10px; --radius-lg:12px; --radius-xl:16px; --radius-bubble:18px; --radius-pill-mobile:24px;
  --sidebar-width:240px; --thread-max-width:780px; --header-height:56px; --touch-target:44px;
  --shadow-composer:0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --color-bg:#14161A; --color-surface:#1C1F24; --color-surface-muted:#20242A;
    --color-sidebar-bg:#191B20; --color-nav-active:#2A2D33; --color-search-bg:#242730;
    --color-avatar-bg:#343840; --color-user-bubble:#2A2D33; --color-skeleton:#2A2D33;

    --color-text:#EDEEF0; --color-text-secondary:#C7CAD0; --color-text-muted:#9AA0A8;
    --color-text-subtle:#767C85; --color-text-inverse:#14161A; --color-link:#6FA3E0;

    --color-border:#2C2F36; --color-border-soft:#262930; --color-border-input:#3A3E46;
    --color-border-sidebar-footer:#2C2F36;

    --color-primary:#EDEEF0; --color-on-primary:#14161A;

    --status-progress-fg:#7FB0EE; --status-progress-dot:#5B93DD;
    --status-waiting-fg:#E0AE5C;  --status-waiting-dot:#D49B2B;
    --status-done-fg:#6FCB90;     --status-done-dot:#3A9A60;
    --status-late-fg:#EB7A70;     --status-late-dot:#D33A2C;
    --status-todo-fg:#9AA0A8;     --status-todo-dot:#6B7078;
    --status-online-dot:#5DB6A0;

    --approval-border:#38405A; --approval-head-bg:#1E2638; --approval-head-fg:#9CC0F5;

    --success-bg:#17261D; --success-border:#2B4A36; --success-icon:#6FCB90; --success-title:#8FE0AC; --success-text:#B9E6C6;
    --error-bg:#2A1917; --error-border:#4A2B27; --error-icon:#EB7A70; --error-title:#F29A91; --error-text:#E8BDB8; --error-btn-border:#5A3530;

    --shadow-composer:0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.45);
  }
}

/* ===== Layout ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-family);font-size:var(--font-size-base);line-height:var(--line-height);color:var(--color-text);background:var(--color-bg)}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--color-link)}

.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.app__sidebar{flex:0 0 var(--sidebar-width);overflow-y:auto}
.app__main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.app__scroll{flex:1 1 auto;overflow-y:auto}
.thread{width:100%;max-width:var(--thread-max-width);margin:0 auto;padding:36px 24px 24px;display:flex;flex-direction:column;gap:36px}
.only-mobile{display:none!important}
.sidebar-backdrop{display:none}

/* ===== Icon button ===== */
.icon-btn{position:relative;width:var(--touch-target);height:var(--touch-target);border:0;background:transparent;border-radius:var(--radius-sm);color:var(--color-text-muted);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn--sm{width:36px;height:36px}
.icon-btn--strong{color:var(--color-text)}
.badge{position:absolute;top:4px;inset-inline-end:4px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:var(--status-late-dot);color:#fff;font-size:10px;line-height:16px;text-align:center;display:none}
.icon-btn.has .badge{display:block}

/* ===== Sidebar ===== */
.sidebar{background:var(--color-sidebar-bg);border-left:1px solid var(--color-border);padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.sidebar__brand-row{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.brand{display:flex;align-items:center;gap:10px}
.brand__mark{width:28px;height:28px;border-radius:8px;background:var(--color-primary);color:var(--color-text-inverse);display:grid;place-items:center;font-weight:700;font-size:14px}
.brand__name{font-weight:600;font-size:15px}

.new-chat-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--color-border-input);background:var(--color-surface);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:500;color:var(--color-text);cursor:pointer}

.search{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:var(--radius-md);background:var(--color-search-bg);color:var(--color-text-muted);font-size:var(--font-size-sm)}
.search__input{border:0;background:transparent;color:var(--color-text);width:100%;outline:none}

.history{display:flex;flex-direction:column;gap:18px;flex:1;overflow-y:auto}
.history__group{display:flex;flex-direction:column;gap:2px}
.history__label{font-size:var(--font-size-2xs);font-weight:500;color:var(--color-text-subtle);padding:0 12px 4px}
.history__row{display:flex;align-items:center;gap:2px}
.history__item{flex:1;min-width:0;display:block;text-align:right;padding:9px 12px;border:0;border-radius:var(--radius-sm);background:none;color:var(--color-text-secondary);font:inherit;font-size:var(--font-size-sm);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history__item[aria-current="page"]{background:var(--color-nav-active);color:var(--color-text);font-weight:500}
.history__del{flex:none;width:28px;height:28px;border:0;background:transparent;color:var(--color-text-subtle);border-radius:var(--radius-sm);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.history__row:hover .history__del,.history__row:focus-within .history__del{opacity:1}
@media (hover:none){.history__del{opacity:1}}
.history__empty{padding:6px 12px;font-size:var(--font-size-sm);color:var(--color-text-subtle)}

.user-card{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--color-border-sidebar-footer)}
.user-card__avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--color-avatar-bg);display:grid;place-items:center;font-weight:600;font-size:var(--font-size-sm)}
.user-card__text{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.user-card__name{font-size:var(--font-size-sm);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card__org{font-size:var(--font-size-2xs);color:var(--color-text-subtle)}
.user-card__actions{display:flex;gap:2px;flex:none}

/* ===== Top bar ===== */
.topbar{flex:none;height:var(--header-height);padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border-soft)}
.topbar__title{margin:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar__actions{display:flex;align-items:center;gap:4px}

/* ===== Messages ===== */
.msg-user{align-self:flex-end;max-width:75%;background:var(--color-user-bubble);padding:10px 16px;border-radius:var(--radius-bubble);white-space:pre-wrap;word-break:break-word}
.msg-agent{display:flex;gap:14px}
.msg-agent__avatar{flex:none;width:28px;height:28px;border-radius:50%;background:var(--color-primary);color:var(--color-text-inverse);display:grid;place-items:center;font-weight:700;font-size:13px}
.msg-agent__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.msg-agent__text{margin:0;white-space:pre-wrap;word-break:break-word}
.msg-agent__text a{text-decoration:underline;text-underline-offset:2px}

.action-notes{display:flex;flex-direction:column;gap:4px}
.action-notes__item{align-self:flex-start;font-size:var(--font-size-xs);color:var(--success-title);background:var(--success-bg);border:1px solid var(--success-border);border-radius:999px;padding:3px 10px}

/* ===== Quick-reply chips ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-end}
.chip{font:inherit;font-size:var(--font-size-sm);padding:7px 14px;border:1px solid var(--color-border-input);background:var(--color-surface);color:var(--color-text-secondary);border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--color-link);color:var(--color-link)}

/* ===== Notice: info / success / error ===== */
.notice{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--radius-lg);border:1px solid}
.notice__icon{flex:none;margin-top:2px;display:flex}
.notice__body{display:flex;flex-direction:column;gap:4px}
.notice__title{font-weight:600}
.notice__text{font-size:var(--font-size-sm);white-space:pre-wrap}
.notice--info{background:var(--approval-head-bg);border-color:var(--approval-border)}
.notice--info .notice__icon,.notice--info .notice__title{color:var(--approval-head-fg)}
.notice--info .notice__text{color:var(--color-text-secondary)}
.notice--success{background:var(--success-bg);border-color:var(--success-border)}
.notice--success .notice__icon{color:var(--success-icon)}
.notice--success .notice__title{color:var(--success-title)}
.notice--success .notice__text{color:var(--success-text)}
.notice--error{background:var(--error-bg);border-color:var(--error-border)}
.notice--error .notice__icon{color:var(--error-icon)}
.notice--error .notice__title{color:var(--error-title)}
.notice--error .notice__text{color:var(--error-text)}

/* ===== Approval card ===== */
.approval{border:1px solid var(--approval-border);background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden}
.approval__head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--approval-head-bg);color:var(--approval-head-fg);font-size:var(--font-size-sm);font-weight:600}
.approval__list{margin:0;padding:4px 16px;display:flex;flex-direction:column}
.approval__item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:12px 0;font-size:var(--font-size-sm)}
.approval__item+.approval__item{border-top:1px solid var(--color-border-soft)}
.approval__change{color:var(--color-text-muted)}
.approval__new{color:var(--color-text);font-weight:700}
.approval__actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--color-border-soft);background:var(--color-bg)}
.appr-thread{margin:0;padding:10px 16px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--color-border-soft);font-size:var(--font-size-sm)}
.appr-msg-mgr b{color:var(--status-waiting-fg)}
.appr-msg-emp b{color:var(--status-progress-fg)}
.appr-instr{display:flex;gap:8px;padding:0 16px 12px}
.appr-instr textarea{flex:1;font:inherit;font-size:var(--font-size-sm);padding:8px 10px;border:1px solid var(--color-border-input);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text);resize:vertical;min-height:2.2em}
.appr-err{color:var(--error-title);font-size:var(--font-size-xs);padding:0 16px 10px}

/* ===== Buttons ===== */
.btn{min-height:40px;padding:0 16px;border-radius:9px;font-size:var(--font-size-sm);cursor:pointer}
.btn--primary{padding:0 18px;border:0;background:var(--color-primary);color:var(--color-on-primary);font-weight:500}
.btn--secondary{border:1px solid var(--color-border-input);background:var(--color-surface);color:var(--color-text)}
.btn--ghost{padding:0 12px;border:0;background:transparent;color:var(--color-text-muted)}
.btn:disabled{opacity:.5;cursor:default}

/* ===== Loading ===== */
.loading{flex:1;display:flex;flex-direction:column;gap:10px;padding-top:3px}
.loading__label{display:flex;align-items:center;gap:10px;font-size:var(--font-size-sm);color:var(--color-text-muted)}
.loading__dots{display:flex;gap:4px}
.loading__dots span{width:6px;height:6px;border-radius:50%;background:var(--color-primary);animation:ma-dot 1.2s infinite ease-in-out}
.loading__dots span:nth-child(2){animation-delay:.2s}
.loading__dots span:nth-child(3){animation-delay:.4s}
@keyframes ma-dot{0%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .loading__dots span{animation:none}
  .loading__dots span:nth-child(2){opacity:.5}
  .loading__dots span:nth-child(3){opacity:.2}
}

/* ===== Composer ===== */
.composer{flex:none;background:linear-gradient(to top, var(--color-bg) 70%, rgba(0,0,0,0));padding:16px 24px 18px}
.composer__inner{max-width:var(--thread-max-width);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer__box{display:flex;align-items:flex-end;gap:8px;padding:8px;border:1px solid var(--color-border-input);border-radius:var(--radius-xl);background:var(--color-surface);box-shadow:var(--shadow-composer)}
.composer__input{flex:1;resize:none;border:0;outline:none;font-size:15px;padding:11px 4px;background:transparent;color:var(--color-text);max-height:200px}
.composer__send{width:44px;height:44px;border:0;border-radius:12px;background:var(--color-primary);color:var(--color-on-primary);display:grid;place-items:center;cursor:pointer;flex:none}
.composer__send:disabled{opacity:.4;cursor:default}
.composer__hint{text-align:center;font-size:var(--font-size-2xs);color:var(--color-text-subtle)}

/* ===== Login ===== */
.login{max-width:420px;margin:14vh auto 0;padding:0 20px;text-align:center}
.login__brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.login h1{font-size:1.5rem;font-weight:700;margin:4px 0}
.login .names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0}
.login .name-btn{min-height:44px;padding:12px;border:1px solid var(--color-border-input);background:var(--color-surface);border-radius:var(--radius-md);cursor:pointer;font:inherit;box-shadow:var(--shadow-composer)}
.login .name-btn:hover{border-color:var(--color-link);color:var(--color-link)}
.login .name-btn small{display:block;color:var(--color-text-subtle);font-size:var(--font-size-2xs);margin-top:3px}
.login__err{color:var(--status-late-fg);font-size:var(--font-size-sm);min-height:1.2em}

/* ===== Toast ===== */
#toast{position:fixed;top:14px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--color-primary);color:var(--color-on-primary);padding:8px 16px;border-radius:999px;font-size:var(--font-size-sm);box-shadow:var(--shadow-composer);z-index:50;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

/* ===== Overlays (notifications / oversight) ===== */
#notifOverlay,#oversight{position:fixed;inset:0;background:var(--color-bg);overflow-y:auto;padding:16px clamp(16px,4vw,32px) 48px;z-index:40}
.overlay-close{margin-inline-start:auto;display:flex}
.ov-wrap{max-width:860px;margin:0 auto}
.sec-title{font-weight:700;font-size:1.05rem;margin:24px 0 8px}
.muted{color:var(--color-text-muted);font-size:var(--font-size-sm)}
.empty{color:var(--color-text-subtle);font-size:var(--font-size-sm)}
.err{color:var(--status-late-fg);font-size:var(--font-size-sm)}

.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow-composer)}
.card--flag{border-inline-start:3px solid var(--status-waiting-fg)}
.card--flag.is-late{border-inline-start-color:var(--status-late-fg)}
.card__top{display:flex;justify-content:space-between;gap:16px;font-weight:600}
.card__sub{font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:4px}
.card__chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip-tag{font-size:var(--font-size-2xs);padding:2px 10px;border-radius:999px;background:var(--color-surface-muted);color:var(--color-text-muted)}
.chip-tag.hot{background:var(--error-bg);color:var(--error-title);font-weight:600}

.nt{background:var(--approval-head-bg);border:1px solid var(--approval-border);border-radius:var(--radius-md);padding:10px 14px;font-size:var(--font-size-sm);white-space:pre-wrap;margin-bottom:8px}
.nt.briefing,.nt.eod_summary{background:var(--color-surface-muted);border-color:var(--color-border)}
.nt-head{font-weight:700;font-size:var(--font-size-xs);margin-bottom:4px;color:var(--approval-head-fg)}
.nt.briefing .nt-head,.nt.eod_summary .nt-head{color:var(--color-text-secondary)}
.nt .dismiss,#notif>.dismiss{margin-top:8px;font:inherit;font-size:var(--font-size-xs);background:none;border:0;color:var(--color-link);cursor:pointer;padding:0;font-weight:600}
.nt--read{opacity:.55}
.nt-date{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:4px}
.nt-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.nt-actions .dismiss{margin-top:0;text-decoration:none;display:inline-block}
.load-more{display:block;margin:4px auto 12px;font:inherit;font-size:var(--font-size-xs);background:none;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:6px 16px;color:var(--color-text-muted);cursor:pointer}
.notif-tabs{display:flex;gap:4px;margin:4px 0 14px;border-bottom:1px solid var(--color-border)}
.notif-tab{font:inherit;font-size:var(--font-size-sm);background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--color-text-muted);cursor:pointer}
.notif-tab.is-active{color:var(--color-text);border-bottom-color:var(--color-link);font-weight:600}

.scroll{overflow-x:auto;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md)}
table{border-collapse:collapse;width:100%;font-size:var(--font-size-sm)}
th,td{text-align:right;padding:8px 12px;border-bottom:1px solid var(--color-border-soft);white-space:nowrap}
thead th{background:var(--color-surface-muted);font-size:var(--font-size-xs);color:var(--color-text-muted);border-bottom:1px solid var(--color-border-input)}
td.num{font-variant-numeric:tabular-nums;text-align:center}
td.num.hot{color:var(--status-late-fg);font-weight:700}

/* Focus visibility (keyboard) */
:where(button,a,input,textarea):focus-visible{outline:2px solid var(--color-link);outline-offset:2px}

/* ============ Mobile (≤ 768px) ============ */
@media (max-width:768px){
  body{line-height:var(--line-height-mobile)}
  .only-mobile{display:grid!important}
  .only-desktop{display:none!important}

  .app__sidebar{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);z-index:30;transform:translateX(100%);transition:transform .22s ease;padding-top:calc(16px + env(safe-area-inset-top))}
  .app.is-sidebar-open .app__sidebar{transform:translateX(0)}
  .sidebar-backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35)}
  .app.is-sidebar-open .sidebar-backdrop{display:block}

  .thread{padding:20px 16px;gap:20px}

  .topbar{height:calc(var(--header-height) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0}
  .topbar__title{flex:1;text-align:center;font-size:15px}

  .msg-user{max-width:80%;padding:9px 14px}
  .msg-agent{gap:0}
  .msg-agent__avatar{display:none}
  .msg-agent__body{gap:12px}

  .composer{background:var(--color-bg);border-top:1px solid var(--color-border-soft);padding:8px 12px calc(28px + env(safe-area-inset-bottom))}

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ICON_SHIELD = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M12 9v4M12 16h.01"/></svg>';
const ICON_ALERT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>';
const ICON_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>';
function iconSpan(svg, cls) { const s = document.createElement("span"); if (cls) s.className = cls; s.innerHTML = svg; return s; }
async function api(path, opts) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("שגיאה " + r.status));
  return d;
}
// activeNudge = הפנייה (אם יש) שהמשתמש בחר במפורש לטפל בה בשיחה הנוכחית — היחידה שמוצגת בגוף
// הצ'אט. state.nudges (כל הפניות הפתוחות) מוצג רק באזור "התראות", לא בתוך שום שיחה.
// "פעיל" (notifActive) ו"היסטוריה" (notifHistory) נפרדים בכוונה — audit "התראות שנקראו נשארות
// ברשימה הפעילה" (2026-10-19): notifActive הוא תמיד listUnseenNotifications בלבד (בלי pagination —
// הנפח תמיד קטן, ברגע שמטפלים/מסמנים יורד מכאן), notifHistory הוא עמוד ה-pagination (נקראות+
// לא-נקראות). נקרא (seenAt) ≠ מטופל/נסגר (finding_events) — markNotificationSeenById לא נוגע
// בממצאי בקרה בכלל (ר' server/index.ts), אז התראה שסומנה נקרא עוברת ל"היסטוריה" בלבד, לא "נפתרת".
const state = { user: null, session: null, thread: [], busy: false, nudges: [], activeNudge: null, approvals: [], es: null, notifTab: "active", notifActive: [], notifHistory: { items: [], hasMore: false }, unseenCount: 0 };
function fmtDate(iso) {
  if (!iso) return "?";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? `${m[3]}/${m[2]}` : iso;
}
/* ביפ קצר, Web Audio API בלבד — רק כשמגיע approval חדש בזמן אמת (לא ב-load רגיל). */
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.36);
    setTimeout(() => { try { ctx.close(); } catch {} }, 500);
  } catch {}
}

/* ---------- פניות יזומות של הבקרה ---------- */
let toastEl = null;
function toast(msg) {
  if (!toastEl) { toastEl = el("div"); toastEl.id = "toast"; document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 4000);
}
async function loadNudges() {
  try {
    const { nudges } = await api("/api/nudges");
    state.nudges = nudges || [];
  } catch { state.nudges = []; }
}
function addNudge(n) {
  if (state.nudges.some(x => x.id === n.id)) return;
  state.nudges.push({ id: n.id, body: n.body, findingKey: n.findingKey, itemId: n.itemId, source: n.source || n.itemSource, mondayUrl: n.mondayUrl ?? null, taskName: n.taskName, currentDueDateISO: n.currentDueDateISO ?? null, approvalId: n.approvalId ?? null, missedCommitment: n.missedCommitment === true });
  // לא מוזרק לגוף השיחה — רק מעדכן את הבאדג'/overlay של "התראות". ר' loadNotifications.
  loadNotifications();
  toast("📌 פנייה חדשה מהבקרה");
}
/** שאלה/הנחיה חיה של מוטי מתוך Approval — מוצגת בדיוק כמו נודג', עם approvalId שממשיך לזרום
 *  עם about. לא ביפ (זה למוטי, לא לעובד) — רק toast, כמו נודג' רגיל. */
function addApprovalQuestionNudge(n) {
  if (state.nudges.some(x => x.id === n.id)) return;
  const ctx = n.context || {};
  state.nudges.push({ id: n.id, body: n.body, findingKey: n.findingKey, itemId: n.itemId, source: n.itemSource, mondayUrl: n.mondayUrl ?? null, taskName: null, currentDueDateISO: null, approvalId: ctx.approvalId ?? null });
  loadNotifications();
  toast("🧑‍⚖️ מוטי מבקש פרטים");
}
/** תשובת עובד הגיעה חיה למוטי — מרעננים את כל רשימת האישורים (כולל היסטוריית ההודעות) ומרנדרים. */
function onApprovalReplyLive(n) {
  loadApprovals().then(() => { renderChat(); beep(); toast(n.body ? ("💬 " + n.body) : "💬 העובד ענה"); });
}
/** notification גנרי (או approval_instruction לעובד) שהגיע חי דרך SSE. */
function onLiveNotification(n) {
  if (n.kind === "approval_instruction") { addApprovalQuestionNudge(n); return; }
  loadNotifications();
  if (n.body) toast(n.body.length > 90 ? n.body.slice(0, 90) + "…" : n.body);
}
/* ---------- אישורים למוטי ---------- */
async function loadApprovals() {
  if (!state.user || !state.user.canApprove) { state.approvals = []; return; }
  try {
    const { approvals } = await api("/api/approvals");
    state.approvals = (approvals || []).filter(a => a.status === "pending" || a.status === "pending_instruction");
  } catch { state.approvals = []; }
}
/** approval חדש שמגיע חי דרך SSE — לא ב-load הראשוני, ולכן כן משמיע ביפ ומראה toast. */
function addApprovalLive(n) {
  const ctx = n.context || {};
  if (!ctx.approvalId || state.approvals.some(a => a.id === ctx.approvalId)) return;
  state.approvals.push({
    id: ctx.approvalId, status: "pending", kind: ctx.kind || "deferral",
    requestedBy: ctx.requestedBy, requestedByName: ctx.requestedByName, taskName: ctx.taskName,
    itemId: n.itemId, itemSource: n.itemSource, messages: [],
    payload: { oldDueDate: ctx.oldDueDate, requestedNewDueDate: ctx.requestedNewDueDate, reason: ctx.reason, priorDeferrals: ctx.priorDeferrals, ruleId: ctx.ruleId },
  });
  renderChat();
  beep();
  toast("🔔 נדרש אישור חדש");
}
function approvalCard(a) {
  const wrap = el("article", "approval");
  wrap.setAttribute("role", "group"); wrap.setAttribute("aria-label", "בקשת אישור");

  const head = el("div", "approval__head");
  head.appendChild(iconSpan(ICON_SHIELD));
  head.appendChild(document.createTextNode("נדרש אישור"));
  wrap.appendChild(head);

  const list = el("div", "approval__list");
  const p = a.payload || {};
  const requester = a.requestedByName || a.requestedBy;
  if (a.kind === "cancellation") {
    // audit 2026-09-17/20: אותו כרטיס, ניסוח נפרד — payload של ביטול הוא {reason,ruleId} בלבד,
    // אין oldDueDate/requestedNewDueDate/priorDeferrals (אלה שדות של דחייה בלבד).
    const row = el("div", "approval__item");
    row.appendChild(document.createTextNode(`${requester} מבקש/ת לבטל / לסמן כלא רלוונטית את המשימה "${a.taskName || a.itemId}".`));
    list.appendChild(row);
    if (p.reason) {
      const r = el("div", "approval__item");
      r.appendChild(document.createTextNode(`סיבה: ${p.reason}`));
      list.appendChild(r);
    }
  } else {
    const row = el("div", "approval__item");
    row.appendChild(document.createTextNode(`${requester} מבקש/ת לדחות את המשימה "${a.taskName || a.itemId}"`));
    const chg = el("span", "approval__change");
    chg.innerHTML = `${fmtDate(p.oldDueDate)} ← <strong class="approval__new">${fmtDate(p.requestedNewDueDate)}</strong>`;
    row.appendChild(chg);
    list.appendChild(row);
    if (p.reason) {
      const r = el("div", "approval__item");
      r.appendChild(document.createTextNode(`סיבה: ${p.reason}`));
      list.appendChild(r);
    }
    const priorCount = p.priorDeferrals ? (p.priorDeferrals.beforeOverdue || 0) + (p.priorDeferrals.afterOverdue || 0) : 0;
    const pr = el("div", "approval__item");
    pr.appendChild(document.createTextNode(`דחיות קודמות: ${priorCount}.`));
    list.appendChild(pr);
  }
  wrap.appendChild(list);

  // התכתבות קצרה — שאלה/הנחיה של מוטי ותשובת העובד, לפי הסדר. מוטי לא צריך "לחפש את העובד
  // בצ'אט נפרד" — הכל כאן, בתוך הכרטיס.
  if (a.messages && a.messages.length) {
    const thread = el("div", "appr-thread");
    for (const m of a.messages) {
      const row = el("div", "appr-msg " + (m.senderRole === "manager" ? "appr-msg-mgr" : "appr-msg-emp"));
      const who = el("b", null, m.senderRole === "manager" ? "מוטי: " : "העובד: ");
      row.appendChild(who);
      row.appendChild(document.createTextNode(m.message));
      thread.appendChild(row);
    }
    wrap.appendChild(thread);
  }

  const actions = el("div", "approval__actions");
  const okBtn = el("button", "btn btn--primary", "✓ אשר"); okBtn.type = "button";
  const noBtn = el("button", "btn btn--secondary", "✕ לא"); noBtn.type = "button";
  const moreBtn = el("button", "btn btn--ghost", a.messages && a.messages.length ? "💬 שאל שוב / הנחיה אחרת" : "💬 פרטים / הנחיה אחרת"); moreBtn.type = "button";
  actions.append(okBtn, noBtn, moreBtn);
  wrap.appendChild(actions);

  const instrBox = el("div", "appr-instr"); instrBox.hidden = true;
  const instrInput = document.createElement("textarea"); instrInput.rows = 2; instrInput.placeholder = "מה ההנחיה?";
  const instrSend = el("button", "btn btn--secondary", "שלח"); instrSend.type = "button";
  instrBox.append(instrInput, instrSend);
  wrap.appendChild(instrBox);

  const errBox = el("div", "appr-err"); errBox.hidden = true;
  const showErr = (msg) => { errBox.textContent = msg; errBox.hidden = false; };
  wrap.appendChild(errBox);

  const removeCard = () => { state.approvals = state.approvals.filter(x => x.id !== a.id); renderChat(); };
  const setBusy = (b) => { okBtn.disabled = noBtn.disabled = moreBtn.disabled = b; };

  okBtn.onclick = async () => {
    setBusy(true); errBox.hidden = true;
    try {
      await api(`/api/approvals/${a.id}/approve`, { method: "POST", body: JSON.stringify({}) });
      toast("✓ אושר ועודכן ב-Monday");
      removeCard();
    } catch (e) { showErr("האישור לא בוצע בפועל: " + e.message); setBusy(false); }
  };
  noBtn.onclick = async () => {
    setBusy(true); errBox.hidden = true;
    try {
      await api(`/api/approvals/${a.id}/reject`, { method: "POST", body: JSON.stringify({}) });
      toast("✕ הבקשה נדחתה");
      removeCard();
    } catch (e) { showErr(e.message); setBusy(false); }
  };
  moreBtn.onclick = () => { instrBox.hidden = !instrBox.hidden; if (!instrBox.hidden) instrInput.focus(); };
  instrSend.onclick = async () => {
    const text = instrInput.value.trim();
    if (!text) return;
    instrSend.disabled = true; errBox.hidden = true;
    try {
      await api(`/api/approvals/${a.id}/instruction`, { method: "POST", body: JSON.stringify({ instruction: text }) });
      instrInput.value = "";
      toast("ההנחיה נשלחה לעובד");
      await loadApprovals(); renderChat(); // מרענן כדי שההודעה של מוטי עצמו תופיע מיד בהתכתבות
    } catch (e) { showErr(e.message); instrSend.disabled = false; }
  };

  return wrap;
}

function openEventStream() {
  try { state.es?.close(); } catch {}
  const es = new EventSource("/api/events");
  state.es = es;
  es.addEventListener("nudge", (e) => { try { addNudge(JSON.parse(e.data)); } catch {} });
  es.addEventListener("approval", (e) => { try { addApprovalLive(JSON.parse(e.data)); } catch {} });
  es.addEventListener("approval_update", (e) => { try { onApprovalReplyLive(JSON.parse(e.data)); } catch {} });
  es.addEventListener("notification", (e) => { try { onLiveNotification(JSON.parse(e.data)); } catch {} });
  es.onerror = () => { /* EventSource מתחבר מחדש לבד */ };
}
const roleHe = { owner:"בעלים", project_manager:"מנהל פרויקט", planner:"שרטוט ותכנון", finance:"כספים", admin:"אדמין" };

/* ---------- login ---------- */
async function showLogin() {
  $("#app").hidden = true; $("#login").hidden = false;
  const box = $("#names"); box.innerHTML = "";
  let users;
  try {
    ({ users } = await api("/api/users"));
  } catch (e) {
    // כניסה רק דרך קישור אישי
    $("#loginSub").textContent = "הכניסה למערכת היא דרך קישור אישי.";
    $("#loginErr").textContent = "פנה/י ליוכי לקבלת הקישור שלך.";
    return;
  }
  for (const u of users) {
    const b = el("button", "name-btn"); b.type = "button";
    b.append(document.createTextNode(u.name), el("small", null, roleHe[u.role] || u.role));
    b.onclick = () => login(u.key);
    box.appendChild(b);
  }
}
async function login(identifier) {

// state.session = מזהה השיחה הנוכחית · state.thread = ההודעות שלה
async function loadSession(id) {

function activeContext() {

/* ---------- היסטוריית שיחות (סרגל צד) ---------- */
function dayLabel(lastAt) {
  const d = new Date(lastAt.replace(" ", "T") + "Z");
  const now = new Date();
  const startOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diffDays = Math.round((startOf(now) - startOf(d)) / 86400000);
  if (diffDays <= 0) return "היום";
  if (diffDays === 1) return "אתמול";
  if (diffDays <= 7) return "השבוע";
  return "קודם לכן";
}
function renderHistoryList(sessions) {
  const nav = $("#historyList"); nav.innerHTML = "";
  if (!sessions.length) { nav.appendChild(el("p", "history__empty", "אין שיחות שמורות עדיין")); return; }
  const order = ["היום", "אתמול", "השבוע", "קודם לכן"];
  const groups = {};
  for (const s of sessions) (groups[dayLabel(s.lastAt)] ??= []).push(s);
  for (const label of order) {
    const items = groups[label];
    if (!items || !items.length) continue;
    const g = el("div", "history__group");
    g.appendChild(el("span", "history__label", label));
    for (const s of items) {
      const row = el("div", "history__row");
      row.dataset.title = s.title.toLowerCase();
      const main = el("button", "history__item", s.title); main.type = "button";
      main.title = s.title;
      if (s.id === state.session) main.setAttribute("aria-current", "page");
      main.onclick = async () => {
        await loadSession(s.id);
        state.activeNudge = null;
        setTopbarTitle(s.title);
        setSidebar(false);
        renderChat();
        renderHistoryList(sessions);
      };
      const del = el("button", "history__del"); del.type = "button";
      del.setAttribute("aria-label", "מחיקת שיחה");
      del.innerHTML = ICON_X;
      del.onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm(`למחוק את השיחה "${s.title}"? אי אפשר לשחזר.`)) return;
        try {
          await api("/api/chat/session/delete", { method: "POST", body: JSON.stringify({ id: s.id }) });
          if (s.id === state.session) { state.session = null; state.thread = []; state.activeNudge = null; setTopbarTitle("שיחה חדשה"); renderChat(); }
          refreshHistorySidebar();
        } catch (e) { alert(e.message); }
      };
      row.append(main, del);
      g.appendChild(row);
    }
    nav.appendChild(g);
  }
  filterHistory($("#historySearch").value);
}
async function refreshHistorySidebar() {
  try { const { sessions } = await api("/api/chat/sessions"); renderHistoryList(sessions || []); }
  catch { renderHistoryList([]); }
}
function filterHistory(q) {
  q = (q || "").trim().toLowerCase();
  $("#historyList").querySelectorAll(".history__group").forEach(g => {
    let any = false;
    g.querySelectorAll(".history__row").forEach(row => {
      const match = !q || row.dataset.title.includes(q);
      row.hidden = !match;
      if (match) any = true;
    });
    g.hidden = !any;
  });
}
$("#historySearch").addEventListener("input", (e) => filterHistory(e.target.value));

/* ---------- סרגל צד נייד ---------- */
const appEl = $("#app");
const MOBILE = window.matchMedia("(max-width: 768px)");

const NT_HEAD = { reminder:"תזכורת מהבקרה", escalation:"הסלמה", briefing:"תדריך הבוקר", eod_summary:"📋 סיכום סוף יום", weekly:"דוח שבועי", approval_request:"נדרש אישור", manager_decision:"תשובה ממוטי", awaiting_decision:"ממתין להחלטתך", task_assigned:"🆕 משימה חדשה", attendance_reminder:"⏰ תזכורת נוכחות" };
/** true ⇔ יש להתראה הזו ממצא בקרה אמיתי מאחוריה (findingKey) — רק אז "טיפול בשיחה" עובר דרך
 *  about. itemId *לא* נדרש כאן יותר (audit "אובדן הקשר בטיפול בשיחה", 2026-10-19): ממצאי
 *  התחייבות (commitment_overdue) נושאים findingKey תקין בלי שום itemId — אין להם פריט Monday

 *  התחייבות ממוקד (עם ה-id המדויק) או הקשר כללי — בלי להמציא שום מזהה. */
function hasFindingContext(n) {

}
/** ממיר notification גנרי (מ-/api/notifications) לאותה צורת אובייקט ש-openNudgeInChat/sendMessage

function notificationToLoopContext(n) {

/** קישור "פתח ב-Monday" משותף לכל כרטיסי ההתראות/נודג'ים — פעולה חיצונית טהורה (לשונית חדשה),

/** כרטיס פנייה פתוחה בתוך overlay ה"התראות" — עם כפתור מפורש לפתיחה בשיחה נקייה. הפנייה
 *  עצמה לא נמחקת/נעלמת כאן; היא נשארת "פתוחה" עד שנפתרת בפועל (תשובה בשיחה). */
function nudgeCard(n) {

/** בחירה מפורשת של המשתמש בפנייה מהבקרה (או בהתראה שכוללת finding מלא) — פותחת שיחה נקייה
 *  חדשה עם ההקשר הזה בלבד, שומרת את ה-context (itemId/source/findingKey/...) לשליחה הבאה דרך
 *  state.activeNudge. ה-about בפועל נבנה ב-sendMessage רק אם itemId+findingKey קיימים — ללא שינוי. */
function openNudgeInChat(n) {

  state.thread = [];

/** תאריך יום הנוכחות של התראת attendance_reminder, אם השרת סיפק אותו (context.workDate — חדשה:
 *  נשמר מרגע היצירה; ישנה: שוחזר בקריאה-בלבד ב-server/index.ts, רק כש-יש התאמה חד-משמעית) —
 *  אחרת null. לא מנחשים כלום בצד הלקוח. */
function attendanceWorkDate(n) {
  return n.kind === "attendance_reminder" && n.context && typeof n.context.workDate === "string" ? n.context.workDate : null;
}
/** התראה בלי finding אמיתי (משימה חדשה שהוקצתה, תזכורת נוכחות, תדריך/דוח, הודעה כללית) — פותחת
 *  שיחה חדשה *בלי* about (לא נוגעת בכלי reply_* / סגירת-ממצא — זה דורש findingKey, שאין כאן), אבל
 *  מזריקה לתיבת הקלט הפניה לגוף ההתראה כך שהעובד לא צריך להסביר מחדש על מה מדובר; הוא עדיין
 *  מקליד/שולח בעצמו (אין שליחה אוטומטית של "דיבור" שהוא לא כתב). מצב-הקריאה (seenAt) לא מתעדכן
 *  כאן בכלל — "טיפול בשיחה" ו"סמן כנקרא" הם שתי פעולות נפרדות בכוונה.
 *  תזכורת נוכחות עם תאריך ידוע (attendanceWorkDate) מקבלת פתיחה ממוקדת עם התאריך המפורש —
 *  כך שגם הודעות-המשך באותה שיחה (שנשלחות עם כל ההיסטוריה) ימשיכו לדעת על איזה יום מדובר,
 *  בלי צורך במנגנון about/LoopContext (תזכורת נוכחות היא לא ממצא בקרה). */
function openContextChat(n) {
  state.session = null;
  state.thread = [];
  state.activeNudge = null;
  setTopbarTitle("שיחה חדשה");
  $("#notifOverlay").hidden = true;
  setSidebar(false);
  renderChat();
  const input = $("#input");
  const workDate = attendanceWorkDate(n);
  if (workDate) {
    input.value = `לגבי שעון הנוכחות שנשאר פתוח מתאריך ${fmtDate(workDate)} — `;
  } else {
    const body = n.body || "";
    const quoted = body.length > 160 ? body.slice(0, 160) + "…" : body;
    input.value = quoted ? `לגבי ההתראה: "${quoted}" — ` : "";
  }
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
  input.focus();
}
/** כרטיס התראה כללית (מ-"פעיל" או מ-"היסטוריה") — "טיפול בשיחה" (reply_* / הקשר-התחייבות / הקשר
 *  כללי, לפי מה שיש — ר' hasFindingContext/notificationToLoopContext), "פתח ב-Monday" אם יש
 *  קישור, ו"סמן כנקרא" אישי: לא משפיע על שום התראה אחרת (markNotificationSeenById בודק
 *  id+user_key), ולא נוגע ב-activeNudge/about בכלל — לחיצה על "טיפול בשיחה" אף פעם לא מסמנת
 *  כנקרא, בכוונה (שני מצבים נפרדים). סימון כנקרא מסיר את ההתראה מ-notifActive (ולכן מ"פעיל",
 *  אם זה הטאב הפתוח) — אבל אם אנחנו כרגע בטאב "היסטוריה" היא נשארת שם, רק מעוצבת כנקראה. */
function notificationCard(n) {
  const extraCls = (n.kind === "briefing" ? " briefing" : n.kind === "eod_summary" ? " eod_summary" : "") + (n.seenAt ? " nt--read" : "");
  const d = el("div", "nt" + extraCls);
  d.appendChild(el("div", "nt-head", NT_HEAD[n.kind] || "הודעה"));
  d.appendChild(document.createTextNode(n.body));
  // תזכורות נוכחות שונות (ימים שונים) נראות כמו הודעה משוכפלת בלי זה — הטקסט עצמו זהה מילה
  // במילה. מוצג רק כש-יש תאריך ידוע בוודאות (attendanceWorkDate) — בלי תאריך, בלי שורה, בלי ניחוש.
  const workDate = attendanceWorkDate(n);
  if (workDate) d.appendChild(el("div", "nt-date", `תאריך הנוכחות: ${fmtDate(workDate)}`));
  const actions = el("div", "nt-actions");
  const openBtn = el("button", "dismiss", "טיפול בשיחה ←"); openBtn.type = "button";
  openBtn.onclick = () => { hasFindingContext(n) ? openNudgeInChat(notificationToLoopContext(n)) : openContextChat(n); };
  actions.appendChild(openBtn);
  const link = mondayLinkEl(n);
  if (link) actions.appendChild(link);
  if (!n.seenAt) {
    const seenBtn = el("button", "dismiss", "✓ סמן כנקרא"); seenBtn.type = "button";
    seenBtn.onclick = async () => {
      seenBtn.disabled = true;
      try { await api(`/api/notifications/${n.id}/seen`, { method: "POST" }); } catch { seenBtn.disabled = false; return; }
      n.seenAt = new Date().toISOString();
      state.unseenCount = Math.max(0, state.unseenCount - 1);
      state.notifActive = state.notifActive.filter((x) => x.id !== n.id);
      if (state.notifTab === "active") {
        renderNotificationsBox(); // "פעיל" = לא-נקראות בלבד — ההתראה הזו פשוט נעלמת מהרשימה
      } else {
        renderNotifBadge();
        d.classList.add("nt--read");
        seenBtn.remove();
      }
    };
    actions.appendChild(seenBtn);
  }
  d.appendChild(actions);
  return d;
}
/** הבאדג'/חיווי על כפתור "התראות" בכותרת — מספר הלא-נקראות (התראות+נודג'ים) בלבד. הכפתור עצמו
 *  תמיד גלוי (גם ב-0 פעילות) כדי שתמיד אפשר לעיין בהיסטוריה, גם בלי שום דבר חדש. */
function renderNotifBadge() {
  const total = state.unseenCount + state.nudges.length;

  $("#notifBadge").textContent = total ? String(total) : "";
}
/** "פעיל" (audit "התראות שנקראו נשארות ברשימה הפעילה", 2026-10-19): אך ורק listUnseenNotifications
 *  — שום דבר שסומן נקרא לא מגיע לכאן בכלל, בלי pagination (הנפח תמיד קטן). קרוא ב-init וגם בכל
 *  SSE live (notification/nudge) כדי שהבאדג' יתעדכן תמיד; מרנדר מחדש רק אם טאב "פעיל" פתוח כרגע —
 *  לא קופץ למשתמש שעומד בטאב "היסטוריה".
 */
async function loadNotifications() {
  await loadNudges();
  try {
    const { notifications, unseenCount } = await api("/api/notifications?unseenOnly=1");
    state.notifActive = notifications || [];
    state.unseenCount = unseenCount || 0;
  } catch { state.notifActive = []; state.unseenCount = 0; }
  if (state.notifTab === "active") renderNotificationsBox();
  else renderNotifBadge();
}
/** "היסטוריה" — העמוד הראשון נטען רק כש-עוברים לטאב (lazy, לא בכל init/SSE). כולל נקראות
 *  וגם לא-נקראות, בדפדוף (GET /api/notifications הרגיל, בלי unseenOnly). */
async function loadNotificationHistory() {
  try {
    const { notifications, hasMore } = await api("/api/notifications?limit=20");
    state.notifHistory = { items: notifications || [], hasMore: !!hasMore };
  } catch { state.notifHistory = { items: [], hasMore: false }; }
  renderNotificationsBox();
}
/** דפדוף: עמוד הבא לפי id של השורה האחרונה שנטענה (לא OFFSET — יציב גם אם מגיעות שורות חדשות). */
async function loadMoreNotificationHistory() {
  const last = state.notifHistory.items[state.notifHistory.items.length - 1];
  if (!last) return;
  try {
    const { notifications, hasMore } = await api(`/api/notifications?limit=20&before=${last.id}`);
    state.notifHistory.items = state.notifHistory.items.concat(notifications || []);
    state.notifHistory.hasMore = !!hasMore;
  } catch { /* השארת המצב הקיים — "טען עוד" פשוט יישאר, אפשר לנסות שוב */ }
  renderNotificationsBox();
}
function switchNotifTab(tab) {
  state.notifTab = tab;
  $("#notifTabActive").classList.toggle("is-active", tab === "active");
  $("#notifTabActive").setAttribute("aria-selected", String(tab === "active"));
  $("#notifTabHistory").classList.toggle("is-active", tab === "history");
  $("#notifTabHistory").setAttribute("aria-selected", String(tab === "history"));
  if (tab === "history" && state.notifHistory.items.length === 0) loadNotificationHistory();
  else renderNotificationsBox();
}
function renderNotificationsBox() {
  const box = $("#notif"); box.innerHTML = "";
  renderNotifBadge();
  if (state.notifTab === "active") {
    if (state.notifActive.length === 0 && state.nudges.length === 0) {
      box.appendChild(el("p", "empty", "אין התראות פעילות 👌"));
      return;
    }
    for (const n of state.nudges) box.appendChild(nudgeCard(n));
    for (const n of state.notifActive) box.appendChild(notificationCard(n));
    if (state.notifActive.some((n) => !n.seenAt)) {
      const btn = el("button", "dismiss", "סמן הכל כנקרא"); btn.type = "button";
      btn.onclick = async () => {
        await api("/api/notifications/seen", { method: "POST" });
        await loadNotifications();
      };
      box.appendChild(btn);
    }
    return;
  }
  if (state.notifHistory.items.length === 0) {
    box.appendChild(el("p", "empty", "אין היסטוריה עדיין"));
    return;
  }
  for (const n of state.notifHistory.items) box.appendChild(notificationCard(n));
  if (state.notifHistory.hasMore) {
    const more = el("button", "load-more", "טען עוד היסטוריה"); more.type = "button";
    more.onclick = loadMoreNotificationHistory;
    box.appendChild(more);
  }
}
$("#notifTabActive").onclick = () => switchNotifTab("active");

$("#notifBtn").onclick = () => { switchNotifTab("active"); $("#notifOverlay").hidden = false; };

/* ---------- רינדור השיחה ---------- */
function renderMarkdown(text) {
  // רינדור מינימלי ובטוח: **מודגש**, ו-[שם](https://...) לקישור לחיץ לפריט ב-Monday (נפתח
  // בלשונית חדשה). הכול רץ על הטקסט *אחרי* esc() — & < > כבר הומרו ל-entities, אז אין דרך
  // להזריק HTML גם מתוך שם פריט שמגיע מ-Monday. רק https:// מתקבל כקישור (לא javascript:/data:).
  const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  let html = esc(text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\[([^[\]]+)\]\((https:\/\/[^\s()<>]+)\)/g, (_m, label, url) => {
    const safeUrl = url.replace(/"/g, "&quot;");
    return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });
  return html;
}
function userBubble(text) {
  const b = el("div", "msg-user", text);
  $("#chat").appendChild(b);
  return b;
}
function agentTurn(text, actions) {
  const art = el("article", "msg-agent");
  const avatar = el("span", "msg-agent__avatar", "M"); avatar.setAttribute("aria-hidden", "true");
  art.appendChild(avatar);
  const body = el("div", "msg-agent__body");
  if (actions && actions.length) {
    const notes = el("div", "action-notes");
    for (const a of actions) notes.appendChild(el("div", "action-notes__item", a));
    body.appendChild(notes);
  }
  const p = el("div", "msg-agent__text");
  p.innerHTML = renderMarkdown(text);
  body.appendChild(p);
  art.appendChild(body);
  $("#chat").appendChild(art);
  return art;
}
function showTyping() {
  const art = el("article", "msg-agent"); art.setAttribute("aria-busy", "true");
  const avatar = el("span", "msg-agent__avatar", "M"); avatar.setAttribute("aria-hidden", "true");
  art.appendChild(avatar);
  const loading = el("div", "loading");
  const label = el("span", "loading__label");
  const dots = el("span", "loading__dots"); dots.setAttribute("aria-hidden", "true");
  dots.append(el("span"), el("span"), el("span"));
  label.appendChild(dots);
  label.appendChild(document.createTextNode("מקליד…"));
  loading.appendChild(label);
  art.appendChild(loading);
  $("#chat").appendChild(art);
  return art;
}
function scrollDown() { const c = $("#scroll"); c.scrollTop = c.scrollHeight; }

function renderChat() {
  const c = $("#chat"); c.innerHTML = "";
  agentTurn("בוקר טוב 🌤️ אני העוזר התפעולי שלך. תגיד/י לי 'בוקר טוב' ואראה לך מה על הפרק היום, ועדכן/י אותי במהלך היום מה ביצעת — אני אדאג לרשום ב-Monday.");
  for (const m of state.thread) {
    if (m.role === "user") userBubble(m.content);
    else agentTurn(m.content, m.actions);
  }
  // הפנייה שהמשתמש בחר במפורש לטפל בה (מתוך "התראות") — היחידה שמוצגת כהודעת-מערכת בשיחה.
  // שאר הפניות הפתוחות לא מוזרקות לכאן בכלל, ר' loadNotifications/nudgeCard.
  if (state.activeNudge) {
    const n = state.activeNudge;
    const wrap = el("div", "notice notice--info"); wrap.setAttribute("role", "status");
    wrap.appendChild(iconSpan(ICON_SHIELD, "notice__icon"));
    const body = el("div", "notice__body");
    body.appendChild(el("strong", "notice__title", n.approvalId ? "🧑‍⚖️ שאלה ממוטי" : "📌 פנייה מהבקרה"));
    body.appendChild(el("span", "notice__text", n.body));
    wrap.appendChild(body);
    c.appendChild(wrap);
  }
  // בקשות אישור פתוחות (מוטי בלבד) — כרטיס בולט עם כפתורי הכרעה
  for (const a of state.approvals) c.appendChild(approvalCard(a));
  if (state.thread.length === 0 && !state.activeNudge && state.approvals.length === 0) {
    const chips = el("div", "chips");
    for (const q of ["בוקר טוב", "מה יש לי היום?", "מה דחוף?"]) {
      const ch = el("button", "chip", q); ch.type = "button";
      ch.onclick = () => sendMessage(q);
      chips.appendChild(ch);
    }
    c.appendChild(chips);
  } else if (state.activeNudge) {
    const hint = el("div", "chips");
    hint.appendChild(el("small", "muted", "אפשר לענות כאן: סיימתי · צריך עוד יומיים · מחכה ליועץ · תקוע כי…"));
    c.appendChild(hint);
  }
  scrollDown();
}

async function sendMessage(text) {
  text = (text ?? $("#input").value).trim();
  if (!text || state.busy) return;
  state.busy = true;
  $("#send").disabled = true;
  $("#input").value = "";
  $("#input").style.height = "auto";
  $("#chat").querySelector(".chips")?.remove();

  state.thread.push({ role: "user", content: text });
  userBubble(text);
  const typing = showTyping();
  scrollDown();

  // ניטור ביצועים (2026-10-14): שעון מונוטוני של הדפדפן (performance.now(), לא Date.now()/שעון
  // השרת) — מודד מרגע השליחה ועד שהתשובה מוצגת על המסך. נשלח לשרת בנפרד, לא ממתינים לו (לא
  // משפיע על חוויית המשתמש) — ר' /api/perf/client ב-server/index.ts.
  const perfSendStart = performance.now();

  try {
    const ctx = [...activeContext()];
    // רק פנייה שהמשתמש בחר במפורש לטפל בה (activeNudge) נשלחת כ-about — לא "הפנייה
    // הפתוחה האחרונה בעולם", כדי לא לערבב הקשר של פנייה שלא נבחרה בשיחה הזו.
    // findingKey בלבד מספיק (audit "אובדן הקשר בטיפול בשיחה", 2026-10-19) — itemId כבר לא תנאי
    // סף כאן: ממצאי התחייבות (commitment_overdue) נושאים findingKey תקין בלי itemId בכלל (אין
    // להם פריט Monday). itemId/source מועברים כמו שהם (null אם אין) — בלי להמציא. השרת (index.ts)
    // ו-chat.ts כבר יודעים להבדיל: itemId קיים → reply_* הרגיל; חסר → הקשר-התחייבות/כללי בלבד.
    const openNudge = state.activeNudge;
    const about = openNudge && openNudge.findingKey
      ? { itemId: openNudge.itemId ?? null, source: openNudge.source ?? null, findingKey: openNudge.findingKey, taskName: openNudge.taskName, currentDueDateISO: openNudge.currentDueDateISO ?? null, approvalId: openNudge.approvalId ?? undefined, missedCommitment: openNudge.missedCommitment === true }
      : undefined;
    // audit שלב ה: מזהה יציב להודעה הזו, לפני השליחה — crypto.randomUUID() (fallback למחרוזת
    // אקראית בדפדפנים ישנים/הקשר לא-מאובטח). נוצר *פעם אחת* לכל שליחה אמיתית, לא לכל ניסיון —
    // אם ה-fetch נכשל, שתי הניסיונות למטה (clientMessageId קבוע) הם "אותה הודעה", לא שתיים.
    const clientMessageId = (crypto.randomUUID ? crypto.randomUUID() : `cmid-${Date.now()}-${Math.random().toString(36).slice(2)}`);
    const payload = JSON.stringify({ messages: ctx, session: state.session, about, clientMessageId });
    let data, lastErr;
    for (let attempt = 0; attempt < 2; attempt++) {
      try { data = await api("/api/chat", { method: "POST", body: payload }); break; }
      catch (e) { lastErr = e; }
    }
    if (!data) throw lastErr;
    const { reply, actions, session, requestId } = data;
    state.session = session;
    typing.remove();
    agentTurn(reply, actions || []);
    const isFirstMessage = state.thread.length === 1;
    state.thread.push({ role: "assistant", content: reply, actions: actions || [] });
    if (isFirstMessage) setTopbarTitle(text.length > 40 ? text.slice(0, 40) + "…" : text);
    refreshHistorySidebar();
    // דיווח ביצועים — fire-and-forget, אחרי שהתשובה כבר על המסך; כשל בדיווח לא אמור להפריע למשתמש.
    if (requestId) {
      const clientTotalMs = performance.now() - perfSendStart;
      api("/api/perf/client", { method: "POST", body: JSON.stringify({ requestId, clientTotalMs }) }).catch(() => {});
    }
    // כל תור שיחה יכול לסגור התראות ברקע (סגירת יום נוכחות, פתרון ממצא, סגירת התחייבות) — מרעננים
    // את רשימת ההתראות תמיד, לא רק כש-יש activeNudge, כדי שהלשונית "פעיל" ומספר ההתראות יתעדכנו
    // מיד בלי רענון ידני (audit "מחזור חיים" 2026-10-20). הפנייה הפעילה (אם יש) אולי נפתרה בשרת
    // (תשובה סגרה את ה-finding) — בודקים אם היא עדיין ברשימת הפתוחות; אם לא, מסירים אותה מהשיחה
    // (state.activeNudge בלבד, לא נמחקת בשרת).
    await loadNotifications();
    if (state.activeNudge && !state.nudges.some(x => x.id === state.activeNudge.id)) {
      state.activeNudge = null;
      renderChat();
    }
  } catch (e) {
    typing.remove();
    const wrap = el("div", "notice notice--error"); wrap.setAttribute("role", "alert");
    wrap.appendChild(iconSpan(ICON_ALERT, "notice__icon"));
    const body = el("div", "notice__body");
    body.appendChild(el("strong", "notice__title", "משהו השתבש"));
    body.appendChild(el("span", "notice__text", e.message));
    wrap.appendChild(body);
    $("#chat").appendChild(wrap);
  } finally {
    state.busy = false;
    $("#send").disabled = false;
    $("#input").focus();
    scrollDown();
  }
}

$("#composer").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(); });
const inputEl = $("#input");
const desktopPlaceholder = inputEl.getAttribute("placeholder");
function applyBreakpoint() {
  setSidebar(false);
  inputEl.setAttribute("placeholder", MOBILE.matches ? inputEl.dataset.placeholderMobile : desktopPlaceholder);
}
MOBILE.addEventListener("change", applyBreakpoint);
applyBreakpoint();

  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
});

/* ---------- oversight ---------- */
$("#oversightBtn").onclick = async () => {
  $("#oversight").hidden = false;
  const body = $("#ovBody"); body.innerHTML = "<p class='muted'>טוען… (כמה שניות)</p>";
  try {
    const jobs = state.user.canOversee
      ? [api("/api/control"), api("/api/oversight"), api("/api/crm"), api("/api/commitments"), api("/api/perf/summary")]
      : [Promise.resolve(null), Promise.resolve(null), api("/api/crm"), api("/api/commitments"), Promise.resolve(null)];
    const [scan, over, crm, comm, perf] = await Promise.all(jobs);
    body.innerHTML = "";
    if (scan) renderControl(scan);
    if (comm && comm.commitments.length) renderCommitments(comm.commitments);
    if (crm) renderCrm(crm);
    if (over) renderOversight(over);
    if (perf) renderPerf(perf);
  } catch (e) { body.innerHTML = ""; body.appendChild(el("p", "err", e.message)); }
};

/* ניטור ביצועים (2026-10-14) — תצוגת P50/P95 בסיסית, קריאה בלבד, למוטי/יוכי. */
function renderPerf(p) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", `ביצועי צ'אט — ${p.sinceHours} שעות אחרונות`));
  if (p.totalRequests === 0) {
    b.appendChild(el("p", "empty", "אין עדיין נתוני ביצועים בחלון הזה"));
    return;
  }
  b.appendChild(el("p", "muted",
    `${p.totalRequests} בקשות · ${p.errorCount} שגיאות · ${p.cachedCount} מה-cache · ${p.avgAiCallCount ?? "?"} קריאות AI בממוצע`));
  const row = (label, m, unit = "ms") => {
    const line = el("div", "card__sub",
      m.count ? `${label}: חצי ${m.avg}${unit} · P50 ${m.p50}${unit} · P95 ${m.p95}${unit} (n=${m.count})` : `${label}: אין נתונים`);
    b.appendChild(line);
  };
  row("שרת", p.server);
  row("AI", p.aiTime);
  row("כלים", p.toolTime);
  row("דפדפן (קצה-לקצה)", p.clientTotal);
}
$("#ovClose").onclick = () => { $("#oversight").hidden = true; };

const SEV = { critical:"🔴", high:"🟠", normal:"⚪" };

function findingCard(f) {
  const box = el("div", "card card--flag" + (f.severity === "critical" ? " is-late" : ""));
  const top = el("div", "card__top");
  top.append(el("span", null, `${SEV[f.severity]} ${f.headline}`), el("span", "muted", f.who));
  box.appendChild(top);
  box.appendChild(el("div", "card__sub", f.detail));
  if (f.url) { const a = el("a", null, "פתח ב-Monday ↗"); a.href = f.url; a.target = "_blank"; a.style.fontSize = "var(--font-size-xs)"; box.appendChild(a); }
  return box;
}

function renderCommitments(list) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", `התחייבויות ללקוחות (${list.length})`));
  const today = new Date().toISOString().slice(0, 10);
  for (const c of list) {
    const late = c.dueDate && c.dueDate < today;
    const box = el("div", "card card--flag" + (late ? " is-late" : ""));
    const top = el("div", "card__top");
    top.append(el("span", null, `${c.toWhom} — ${c.what}`), el("span", "muted", c.by));
    box.appendChild(top);
    box.appendChild(el("div", "card__sub", (c.dueDate ? (late ? "באיחור · יעד " : "יעד ") + c.dueDate : "בלי תאריך") + (c.project ? ` · ${c.project}` : "")));
    b.appendChild(box);
  }
}

function renderCrm(r) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", "מכירות וכספים"));
  b.appendChild(el("p", "muted", `${r.counts.critical} קריטי · ${r.counts.high} דחוף · ${r.counts.normal} נוסף`));
  const groups = { "גבייה": [], "מכירות": [], "לידים": [] };
  for (const f of r.findings) (groups[f.project] || (groups[f.project] = [])).push(f);
  for (const [area, list] of Object.entries(groups)) {
    if (!list.length) continue;
    const head = el("div", "muted", `${area} — ${list.length}`); head.style.fontWeight = "700";
    b.appendChild(head);
    for (const f of list.filter(x => x.severity !== "normal")) b.appendChild(findingCard(f));
    const rest = list.filter(x => x.severity === "normal");
    if (rest.length) {
      const d = el("details"); d.style.margin = ".3rem 0 1rem";
      d.appendChild(el("summary", "muted", `עוד ${rest.length} ב${area} (לא דחוף)`));
      for (const f of rest) d.appendChild(el("div", "card__sub", `⚪ ${f.headline} — ${f.who}`));
      b.appendChild(d);
    }
  }
}

function renderControl(r) {
  const b = $("#ovBody");
  b.appendChild(el("div", "sec-title", "בקרה יזומה — פרויקטים ומשימות"));
  b.appendChild(el("p", "muted", `${r.counts.critical} קריטי · ${r.counts.high} דחוף · ${r.counts.normal} נוסף`));
  if (r.forManager.length === 0) {
    b.appendChild(el("p", "empty", "אין ממצאים קריטיים או דחופים 👌"));
  }
  for (const f of r.forManager) b.appendChild(findingCard(f));
  const rest = r.findings.filter(f => f.severity === "normal");
  if (rest.length) {
    const d = el("details"); d.style.margin = ".6rem 0 1rem";
    d.appendChild(el("summary", "muted", `עוד ${rest.length} ממצאים (לא דחופים)`));
    for (const f of rest) d.appendChild(el("div", "card__sub", `${SEV[f.severity]} ${f.headline} — ${f.who}`));
    b.appendChild(d);
  }
}

function renderOversight(r) {
  const b = $("#ovBody");
  const t = r.totals;
  b.appendChild(el("div", "sec-title", "עומס לכל אדם"));
  b.appendChild(el("p", "muted", `סה"כ ${t.openTasks} משימות פתוחות בצוות · ${t.overdue} באיחור · ${t.stuck} תקועות`));

  const sc = el("div", "scroll"); const tbl = el("table");
  tbl.innerHTML = "<thead><tr><th>שם</th><th>פתוחות</th><th>באיחור</th><th>תקועות</th><th>חוסם אחרים</th><th>להיום</th></tr></thead>";
  const tb = el("tbody");
  for (const p of r.people) {
    const tr = el("tr");
    tr.appendChild(el("td", null, p.name));
    for (const [k, hot] of [["open"],["overdue","h"],["stuck","h"],["blocking"],["dueToday"]]) {
      tr.appendChild(el("td", "num" + (hot && p.counts[k] > 0 ? " hot" : ""), String(p.counts[k])));
    }
    tb.appendChild(tr);
    if (p.worst.length) {
      const wr = el("tr"); const td = el("td"); td.colSpan = 6;
      td.style.cssText = "white-space:normal;font-size:var(--font-size-xs);color:var(--color-text-muted)";
      td.textContent = "הכי באיחור: " + p.worst.map(w => `${w.name} (${w.daysOverdue} י')`).join(" · ");
      wr.appendChild(td); tb.appendChild(wr);
    }
  }
  tbl.appendChild(tb); sc.appendChild(tbl); b.appendChild(sc);

  b.appendChild(el("div", "sec-title", `פרויקטים שדורשים תשומת לב (${r.projects.length})`));
  for (const p of r.projects) {
    const box = el("div", "card card--flag");
    const top = el("div", "card__top");
    top.append(el("span", null, p.name), el("span", "muted", p.status));
    box.appendChild(top);
    box.appendChild(el("div", "card__sub", `אחראי: ${p.owner}${p.deliveryDate ? " · מסירה: " + p.deliveryDate : ""}`));
    const ch = el("div", "card__chips");
    for (const f of p.flags) ch.appendChild(el("span", "chip-tag" + (/תקוע|איחור/.test(f) ? " hot" : ""), f));
    box.appendChild(ch);
    b.appendChild(box);
  }
}
